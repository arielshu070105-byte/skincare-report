<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>送件日誌</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f4f4f5" id="metaThemeColor">
<script>
(function () {
  try {
    var saved = localStorage.getItem("charis-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(232,232,235,0.55) 100%);
    --card-border: rgba(0,0,0,0.07);
    --ink: #1c1c1e;
    --ink-soft: #8e8e93;
    --line: rgba(0,0,0,0.08);
    --input-bg: rgba(255,255,255,0.6);
    --pill-bg: rgba(0,0,0,0.05);
    --pill-active-bg: rgba(255,255,255,0.95);
    --accent: #1c1c1e;
    --accent-soft: rgba(28,28,30,0.08);
    --accent-ink: #ffffff;
    --accent-shadow: rgba(0,0,0,0.22);
    --overlay-scrim: rgba(0,0,0,0.35);
    --radius: 26px;
    --shadow: 0 20px 40px rgba(0,0,0,0.09), 0 2px 8px rgba(0,0,0,0.05);
    --danger: #e0796f;
    --ok: #6fb98f;
    --blur: blur(20px) saturate(140%);
    --glow-1: rgba(0,0,0,0.045);
    --glow-2: rgba(0,0,0,0.03);
    --glow-3: rgba(0,0,0,0.035);
    --stamp-grey: #8e8e93; --stamp-grey-bg: rgba(142,142,147,0.14);
    --stamp-blue: #3f7ab8; --stamp-blue-bg: rgba(63,122,184,0.14);
    --stamp-amber: #b8863f; --stamp-amber-bg: rgba(184,134,63,0.14);
    --stamp-red: #c0564a; --stamp-red-bg: rgba(192,86,74,0.14);
    --stamp-green: #4a9165; --stamp-green-bg: rgba(74,145,101,0.14);
    --tab-contract: #435a8c; --tab-claim: #93502e; --tab-change: #5f6f34; --tab-group: #74456b;
  }
  [data-theme="dark"] {
    --bg: #0c0c0d;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
    --card-border: rgba(255,255,255,0.1);
    --ink: #f2f2f3;
    --ink-soft: #98989d;
    --line: rgba(255,255,255,0.1);
    --input-bg: rgba(255,255,255,0.08);
    --pill-bg: rgba(255,255,255,0.06);
    --pill-active-bg: rgba(255,255,255,0.16);
    --accent: #f2f2f3;
    --accent-soft: rgba(255,255,255,0.12);
    --accent-ink: #0c0c0d;
    --accent-shadow: rgba(0,0,0,0.6);
    --overlay-scrim: rgba(0,0,0,0.55);
    --shadow: 0 20px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
    --glow-1: rgba(255,255,255,0.06);
    --glow-2: rgba(255,255,255,0.04);
    --glow-3: rgba(255,255,255,0.05);
    --stamp-grey: #a3aebb; --stamp-grey-bg: rgba(163,174,187,0.16);
    --stamp-blue: #7fb0e0; --stamp-blue-bg: rgba(127,176,224,0.16);
    --stamp-amber: #dcb24d; --stamp-amber-bg: rgba(220,178,77,0.16);
    --stamp-red: #e0847a; --stamp-red-bg: rgba(224,132,122,0.16);
    --stamp-green: #7fc498; --stamp-green-bg: rgba(127,196,152,0.16);
    --tab-contract: #7f97d1; --tab-claim: #d19067; --tab-change: #a3b56a; --tab-group: #c084b7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(45% 38% at 15% 0%, var(--glow-1) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(50% 42% at 100% 25%, var(--glow-2) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(55% 45% at 10% 100%, var(--glow-3) 0%, rgba(0,0,0,0) 70%);
    background-attachment: fixed; background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  #shell { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; position: relative; }
  h2 { font-size: 16px; font-weight: 900; margin: 0 0 14px; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
  p { line-height: 1.6; color: var(--ink-soft); font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 14px 0 6px; letter-spacing: 0.03em; }
  input, textarea, select {
    width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary { width: 100%; min-height: 50px; padding: 15px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; margin-top: 18px; letter-spacing: 0.03em; box-shadow: 0 12px 28px var(--accent-shadow); transition: transform 0.1s ease; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost { background: none; color: var(--accent); padding: 10px; font-size: 13px; font-weight: 700; width: 100%; margin-top: 6px; min-height: 40px; }
  .btn-sm { padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
  .center-screen { padding: 56px 0 0; }
  .brand-wordmark { font-size: 24px; font-weight: 900; letter-spacing: 0.06em; color: var(--ink); margin-bottom: 2px; }
  .brand-subtitle { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  .theme-switch { width: 44px; height: 24px; border-radius: 999px; background: var(--pill-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: flex-start; padding: 2px; flex-shrink: 0; transition: background 0.2s ease, justify-content 0.2s ease; }
  [data-theme="dark"] .theme-switch { justify-content: flex-end; }
  .theme-switch-knob { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); flex-shrink: 0; box-shadow: 0 0 0 3px rgba(0,0,0,0); }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(111,185,143,0.7); }
  .status-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px 14px; border-radius: 999px; display: none; }
  .status-msg:not(:empty) { display: block; background: var(--input-bg); color: var(--ink-soft); }
  .status-msg.ok { background: rgba(111,185,143,0.2); color: var(--ok); font-weight: 700; }
  .status-msg.err { background: rgba(224,121,111,0.16); color: var(--danger); font-weight: 700; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .tab-view { display: none; }
  .tab-view.active { display: block; }

  .greeting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .greeting-left { min-width: 0; }
  .greeting-hello { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .greeting-name { font-size: 19px; font-weight: 900; color: var(--ink); line-height: 1.25; }
  .greeting-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
  .greeting-right-top { display: flex; align-items: center; gap: 6px; }
  .header-icon-btn { width: 26px; height: 26px; border-radius: 50%; background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-tile { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .stat-tile[role="button"] { cursor: pointer; }
  .stat-tile .num { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.1; }
  .stat-tile.warn .num { color: var(--danger); }
  .stat-tile .label { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .export-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .export-row input[type="month"] { flex: 1; min-width: 120px; margin: 0; min-height: 44px; }
  .export-row .export-range-sep { color: var(--ink-soft); font-size: 13px; flex-shrink: 0; }
  .export-row button { flex-shrink: 0; white-space: nowrap; min-height: 44px; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--card-border); background: var(--input-bg); color: var(--ink-soft); font-size: 13.5px; padding: 8px 14px; border-radius: 999px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filter-row .chip { white-space: nowrap; }

  .day-group { margin-bottom: 6px; }
  .day-head { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 8px; padding: 0 2px; }
  .day-head:first-child { margin-top: 0; }
  .day-head .date { font-weight: 900; font-size: 13.5px; color: var(--ink); }
  .day-head .count { color: var(--ink-soft); font-size: 12px; }

  .entry { border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; }
  .entry > summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; align-items: stretch; gap: 10px; }
  .entry > summary::-webkit-details-marker { display: none; }
  .tab-stripe { width: 4px; border-radius: 4px; flex-shrink: 0; align-self: stretch; }
  .tab-stripe.contract { background: var(--tab-contract); }
  .tab-stripe.claim { background: var(--tab-claim); }
  .tab-stripe.change { background: var(--tab-change); }
  .tab-stripe.group { background: var(--tab-group); }
  .entry-main { flex: 1; min-width: 0; }
  .entry-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .entry-name { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .entry-sub { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink-soft); }
  .stamp { display: inline-block; font-size: 11px; letter-spacing: 0.02em; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .stamp.st-未送件 { color: var(--stamp-grey); background: var(--stamp-grey-bg); }
  .stamp.st-已送出 { color: var(--stamp-blue); background: var(--stamp-blue-bg); }
  .stamp.st-待補件 { color: var(--stamp-red); background: var(--stamp-red-bg); }
  .stamp.st-已完成 { color: var(--stamp-green); background: var(--stamp-green-bg); }
  .entry-detail { padding: 0 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .detail-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-save, .btn-delete { flex: 1; border-radius: 999px; padding: 11px; font-size: 13.5px; font-weight: 700; }
  .btn-save { background: var(--accent); color: var(--accent-ink); }
  .btn-delete { background: rgba(224,121,111,0.14); color: var(--danger); }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 24px 10px; }

  #setupNotice, #loginScreen, #app { display: none; }
</style>
</head>
<body>
<div id="shell">

  <div id="loginScreen" class="center-screen">
    <div class="brand-wordmark">TG全球人壽</div>
    <div class="brand-subtitle">送件日誌</div>
    <p>用跟保養品回報一樣的帳號登入</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">登入</button>
    <p id="loginStatus" class="status-msg"></p>
  </div>

  <div id="app">
    <div class="greeting-row">
      <div class="greeting-left">
        <div class="greeting-hello">送件日誌</div>
        <div class="greeting-name">TG全球人壽</div>
      </div>
      <div class="greeting-right">
        <div class="greeting-right-top">
          <button class="header-icon-btn" onclick="doLogout()" title="登出">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
          <button class="theme-switch" onclick="toggleTheme()" title="切換深色/淺色主題">
            <span class="theme-switch-knob" id="themeSwitchKnob"></span>
          </button>
        </div>
        <div class="status-dot ok" title="即時同步中"></div>
      </div>
    </div>

    <div class="chip-group" id="pageTabs" role="group" aria-label="頁面切換" style="margin-bottom:18px">
      <button type="button" class="chip" data-tab="submissions" aria-pressed="true">送件日誌</button>
      <button type="button" class="chip" data-tab="gifts" aria-pressed="false">送禮記錄</button>
      <button type="button" class="chip" data-tab="calendar" aria-pressed="false">年曆</button>
    </div>

    <div class="tab-view active" id="tabSubmissions">
    <div class="stats-row">
      <div class="stat-tile"><div class="num" id="statToday">0</div><div class="label">今日送件</div></div>
      <div class="stat-tile warn" id="statPendingTile" onclick="filterByStatus('未送件')" role="button" tabindex="0"><div class="num" id="statPending">0</div><div class="label">未送件</div></div>
      <div class="stat-tile"><div class="num" id="statMonth">0</div><div class="label">本月累計</div></div>
    </div>

    <div class="card">
      <h2>新增送件記錄</h2>
      <div class="field-row">
        <div><label for="f-date">送件日期</label><input type="date" id="f-date"></div>
        <div><label for="f-name">客戶姓名</label><input type="text" id="f-name" placeholder="王小明"></div>
      </div>
      <label>案件類型</label>
      <div class="chip-group" id="typeChips" role="group" aria-label="案件類型">
        <button type="button" class="chip" data-value="新契約" aria-pressed="true">新契約</button>
        <button type="button" class="chip" data-value="理賠" aria-pressed="false">理賠</button>
        <button type="button" class="chip" data-value="契變" aria-pressed="false">契變</button>
        <button type="button" class="chip" data-value="團保" aria-pressed="false">團保</button>
      </div>
      <div id="contractContents" style="display:none">
        <label>送件內容</label>
        <div class="chip-group" id="contentChips" role="group" aria-label="送件內容"></div>
        <input type="text" id="f-content-other" placeholder="其他…" style="margin-top:8px">
      </div>
      <label for="f-policy">保單號碼</label>
      <input type="text" id="f-policy" placeholder="選填">
      <label for="f-method">送件方式</label>
      <select id="f-method">
        <option>紙本</option>
        <option>平板</option>
      </select>
      <label for="f-status">狀態</label>
      <select id="f-status">
        <option>未送件</option>
        <option>已送出</option>
        <option>待補件</option>
        <option>已完成</option>
      </select>
      <label for="f-note">備註</label>
      <textarea id="f-note" placeholder="缺件項目、特殊狀況…"></textarea>
      <button class="btn-primary" onclick="submitEntry()">送出記錄</button>
      <p id="addStatus" class="status-msg"></p>
    </div>

    <div class="card">
      <h2>送件記錄</h2>
      <div class="export-row">
        <input type="month" id="exportMonthFrom">
        <span class="export-range-sep">至</span>
        <input type="month" id="exportMonthTo">
        <button type="button" class="btn-sm" onclick="exportMonth()">匯出 Excel</button>
      </div>
      <div class="filter-row" id="filterRow" role="group" aria-label="篩選">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="chip" data-filter="新契約" aria-pressed="false">新契約</button>
        <button type="button" class="chip" data-filter="理賠" aria-pressed="false">理賠</button>
        <button type="button" class="chip" data-filter="契變" aria-pressed="false">契變</button>
        <button type="button" class="chip" data-filter="團保" aria-pressed="false">團保</button>
        <button type="button" class="chip" data-filter="待補件" aria-pressed="false">待補件</button>
        <button type="button" class="chip" data-filter="未送件" aria-pressed="false">未送件</button>
        <button type="button" class="chip" data-filter="已送出" aria-pressed="false">已送出</button>
      </div>
      <input type="text" id="searchBox" placeholder="搜尋客戶姓名…" style="margin-bottom:14px">
      <div id="list"></div>
    </div>
    </div>

    <div class="tab-view" id="tabGifts">
    <div class="card">
      <h2>送禮記錄</h2>
      <div class="field-row">
        <div><label for="g-date">日期</label><input type="date" id="g-date"></div>
        <div><label for="g-name">客戶姓名</label><input type="text" id="g-name" placeholder="王小明"></div>
      </div>
      <label>情境</label>
      <div class="chip-group" id="giftOccasionChips" role="group" aria-label="情境">
        <button type="button" class="chip" data-value="送保單" aria-pressed="true">送保單</button>
        <button type="button" class="chip" data-value="到府拜訪" aria-pressed="false">到府拜訪</button>
        <button type="button" class="chip" data-value="其他" aria-pressed="false">其他</button>
      </div>
      <div class="field-row">
        <div><label for="g-gift">禮物內容</label><input type="text" id="g-gift" placeholder="例如:水果禮盒"></div>
        <div><label for="g-value">禮物價值</label><input type="number" id="g-value" placeholder="選填" inputmode="numeric"></div>
      </div>
      <label for="g-note">備註</label>
      <textarea id="g-note" placeholder="選填"></textarea>
      <button class="btn-primary" onclick="submitGift()">送出記錄</button>
      <p id="giftAddStatus" class="status-msg"></p>
      <div class="export-row" style="margin-top:18px">
        <input type="month" id="giftExportMonthFrom">
        <span class="export-range-sep">至</span>
        <input type="month" id="giftExportMonthTo">
        <button type="button" class="btn-sm" onclick="exportGiftMonth()">匯出 Excel</button>
      </div>
      <div id="giftList"></div>
    </div>
    </div>

    <div class="tab-view" id="tabCalendar">
    <div class="stats-row" id="calendarStatsRow"></div>
    <div class="card">
      <h2>年曆</h2>
      <div class="field-row">
        <div><label for="c-date">日期</label><input type="date" id="c-date"></div>
        <div><label for="c-name">客戶姓名</label><input type="text" id="c-name" placeholder="王小明"></div>
      </div>
      <label>項目</label>
      <div class="chip-group" id="calendarItemChips" role="group" aria-label="項目">
        <button type="button" class="chip" data-value="年曆" aria-pressed="false">年曆</button>
        <button type="button" class="chip" data-value="桌曆" aria-pressed="false">桌曆</button>
        <button type="button" class="chip" data-value="小本子" aria-pressed="false">小本子</button>
        <button type="button" class="chip" data-value="中式桌曆" aria-pressed="false">中式桌曆</button>
        <button type="button" class="chip" data-value="月曆" aria-pressed="false">月曆</button>
      </div>
      <label for="c-note">備註</label>
      <textarea id="c-note" placeholder="選填"></textarea>
      <button class="btn-primary" onclick="submitCalendar()">送出記錄</button>
      <p id="calendarAddStatus" class="status-msg"></p>
      <div class="export-row" style="margin-top:18px">
        <input type="month" id="calendarExportMonthFrom">
        <span class="export-range-sep">至</span>
        <input type="month" id="calendarExportMonthTo">
        <button type="button" class="btn-sm" onclick="exportCalendarMonth()">匯出 Excel</button>
      </div>
      <div id="calendarList"></div>
    </div>
    </div>
  </div>

</div>

<script type="module">
import { initFirebase } from "./firebase-init.js";
import { escapeHtml, todayISO } from "./shared.js";
import {
  collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const { db, auth } = initFirebase();
const COLLECTION = "insuranceSubmissions";
const GIFT_COLLECTION = "giftLog";
const CALENDAR_COLLECTION = "calendarLog";
const CALENDAR_ITEMS = ["年曆", "桌曆", "小本子", "中式桌曆", "月曆"];
const TYPE_STRIPE = { "新契約": "contract", "理賠": "claim", "契變": "change", "團保": "group" };
const CONTENT_OPTIONS_BY_TYPE = {
  "新契約": ["行動投保同意書", "授權書", "保單簽收", "未承保契變書", "財務狀況告知書"],
  "理賠": ["行動理賠", "診斷證明書", "收據", "X光片"],
  "契變": ["授權書"],
  "團保": ["續保文件"],
};

let entries = [];
let unsubscribeList = null;
let activeFilter = "all";
let searchTerm = "";
let selectedType = "新契約";
let selectedContents = new Set();
let giftEntries = [];
let unsubscribeGiftList = null;
let selectedOccasion = "送保單";
let calendarEntries = [];
let unsubscribeCalendarList = null;
let selectedCalendarItems = new Set();

function currentTheme() { return document.documentElement.getAttribute("data-theme") || "light"; }
window.toggleTheme = function () {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("charis-theme", next); } catch (e) {}
};

document.getElementById("f-date").value = todayISO();
document.getElementById("exportMonthFrom").value = todayISO().slice(0, 7);
document.getElementById("exportMonthTo").value = todayISO().slice(0, 7);
document.getElementById("g-date").value = todayISO();
document.getElementById("giftExportMonthFrom").value = todayISO().slice(0, 7);
document.getElementById("giftExportMonthTo").value = todayISO().slice(0, 7);
document.getElementById("c-date").value = todayISO();
document.getElementById("calendarExportMonthFrom").value = todayISO().slice(0, 7);
document.getElementById("calendarExportMonthTo").value = todayISO().slice(0, 7);

const pageTabs = document.getElementById("pageTabs");
pageTabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  [...pageTabs.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  document.getElementById("tabSubmissions").classList.toggle("active", btn.dataset.tab === "submissions");
  document.getElementById("tabGifts").classList.toggle("active", btn.dataset.tab === "gifts");
  document.getElementById("tabCalendar").classList.toggle("active", btn.dataset.tab === "calendar");
});

const giftOccasionChips = document.getElementById("giftOccasionChips");
giftOccasionChips.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  [...giftOccasionChips.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  selectedOccasion = btn.dataset.value;
});

const calendarItemChips = document.getElementById("calendarItemChips");
calendarItemChips.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const pressed = btn.getAttribute("aria-pressed") === "true";
  btn.setAttribute("aria-pressed", pressed ? "false" : "true");
  if (pressed) selectedCalendarItems.delete(btn.dataset.value);
  else selectedCalendarItems.add(btn.dataset.value);
});

const typeChips = document.getElementById("typeChips");
const contractContents = document.getElementById("contractContents");
const contentChips = document.getElementById("contentChips");
const contentOtherInput = document.getElementById("f-content-other");

function renderContentChips(type) {
  const options = CONTENT_OPTIONS_BY_TYPE[type];
  selectedContents.clear();
  contentOtherInput.value = "";
  if (!options) {
    contractContents.style.display = "none";
    contentChips.innerHTML = "";
    return;
  }
  contractContents.style.display = "block";
  contentChips.innerHTML = options.map((c) =>
    '<button type="button" class="chip" data-value="' + c + '" aria-pressed="false">' + c + '</button>'
  ).join("");
}
renderContentChips(selectedType);

typeChips.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  [...typeChips.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  selectedType = btn.dataset.value;
  renderContentChips(selectedType);
});

contentChips.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const pressed = btn.getAttribute("aria-pressed") === "true";
  btn.setAttribute("aria-pressed", pressed ? "false" : "true");
  if (pressed) selectedContents.delete(btn.dataset.value);
  else selectedContents.add(btn.dataset.value);
});

function buildContentsList(selectedSet, otherText) {
  const list = Array.from(selectedSet);
  if (otherText.trim()) list.push("其他：" + otherText.trim());
  return list;
}

const filterRow = document.getElementById("filterRow");
filterRow.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  [...filterRow.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  activeFilter = btn.dataset.filter;
  render();
});

document.getElementById("statPendingTile").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); window.filterByStatus("未送件"); }
});

window.filterByStatus = function (status) {
  const btn = [...filterRow.children].find((c) => c.dataset.filter === status);
  if (!btn) return;
  [...filterRow.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  activeFilter = status;
  render();
  document.getElementById("list").scrollIntoView({ behavior: "smooth", block: "start" });
};

document.getElementById("searchBox").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim();
  render();
});

window.submitEntry = async function () {
  const name = document.getElementById("f-name").value.trim();
  const statusEl = document.getElementById("addStatus");
  if (!name) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  const payload = {
    date: document.getElementById("f-date").value || todayISO(),
    name,
    type: selectedType,
    policy: document.getElementById("f-policy").value.trim(),
    method: document.getElementById("f-method").value,
    status: document.getElementById("f-status").value,
    note: document.getElementById("f-note").value.trim(),
    contents: CONTENT_OPTIONS_BY_TYPE[selectedType] ? buildContentsList(selectedContents, contentOtherInput.value) : [],
    createdAt: serverTimestamp(),
  };
  statusEl.textContent = "送出中…"; statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, COLLECTION), payload);
    document.getElementById("f-name").value = "";
    document.getElementById("f-policy").value = "";
    document.getElementById("f-note").value = "";
    document.getElementById("f-date").value = todayISO();
    document.getElementById("f-method").selectedIndex = 0;
    document.getElementById("f-status").selectedIndex = 0;
    [...typeChips.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
    typeChips.children[0].setAttribute("aria-pressed", "true");
    selectedType = "新契約";
    renderContentChips(selectedType);
    statusEl.textContent = "已送出"; statusEl.className = "status-msg ok";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message; statusEl.className = "status-msg err";
  }
};

function todayPrefix() { return todayISO(); }
function updateStats() {
  const today = todayPrefix();
  const monthPrefix = today.slice(0, 7);
  document.getElementById("statToday").textContent = entries.filter((e) => e.date === today).length;
  document.getElementById("statPending").textContent = entries.filter((e) => e.status === "未送件").length;
  document.getElementById("statMonth").textContent = entries.filter((e) => e.date && e.date.startsWith(monthPrefix)).length;
}

function matchesFilter(entry) {
  if (activeFilter === "all") return true;
  if (["待補件", "未送件", "已送出"].includes(activeFilter)) return entry.status === activeFilter;
  return entry.type === activeFilter;
}
function matchesSearch(entry) {
  if (!searchTerm) return true;
  return entry.name.includes(searchTerm);
}

function buildEntryCard(entry) {
  const wrap = document.createElement("details");
  wrap.className = "entry";
  const summary = document.createElement("summary");
  const stripe = document.createElement("div");
  stripe.className = "tab-stripe " + (TYPE_STRIPE[entry.type] || "contract");
  const main = document.createElement("div");
  main.className = "entry-main";
  let typeLabel = entry.type;
  if (CONTENT_OPTIONS_BY_TYPE[entry.type] && entry.contents && entry.contents.length) {
    typeLabel += "：" + entry.contents.join("、");
  }
  const sub = [typeLabel];
  if (entry.policy) sub.push(entry.policy);
  main.innerHTML =
    '<div class="entry-top"><span class="entry-name">' + escapeHtml(entry.name) + '</span>' +
    '<span class="stamp st-' + entry.status + '">' + entry.status + "</span></div>" +
    '<div class="entry-sub">' + sub.map((t) => '<span>' + escapeHtml(t) + '</span>').join("") + "</div>";
  summary.appendChild(stripe);
  summary.appendChild(main);
  wrap.appendChild(summary);

  const detail = document.createElement("div");
  detail.className = "entry-detail";
  detail.innerHTML =
    '<label>送件日期</label><input type="date" class="e-date" value="' + entry.date + '">' +
    '<label>客戶姓名</label><input type="text" class="e-name" value="' + escapeHtml(entry.name) + '">' +
    '<label>保單號碼</label><input type="text" class="e-policy" value="' + escapeHtml(entry.policy || "") + '">' +
    '<label>送件方式</label><select class="e-method"></select>' +
    '<label>狀態</label><select class="e-status"></select>' +
    '<label>案件類型</label><select class="e-type"></select>' +
    (CONTENT_OPTIONS_BY_TYPE[entry.type]
      ? (() => {
          const existingOther = (entry.contents || []).find((v) => v.startsWith("其他："));
          const otherText = existingOther ? existingOther.slice(3) : "";
          return '<label>送件內容</label><div class="chip-group e-contents" role="group" aria-label="送件內容">' +
            CONTENT_OPTIONS_BY_TYPE[entry.type].map((c) => '<button type="button" class="chip" data-value="' + escapeHtml(c) + '" aria-pressed="' +
              ((entry.contents || []).includes(c) ? "true" : "false") + '">' + escapeHtml(c) + '</button>').join("") +
            '</div>' +
            '<input type="text" class="e-content-other" placeholder="其他…" value="' + escapeHtml(otherText) + '" style="margin-top:8px">';
        })()
      : '') +
    '<label>備註</label><textarea class="e-note">' + escapeHtml(entry.note || "") + '</textarea>' +
    '<div class="detail-actions"><button type="button" class="btn-save">儲存變更</button><button type="button" class="btn-delete">刪除</button></div>' +
    '<p class="e-status-msg status-msg"></p>';

  const eContents = detail.querySelector(".e-contents");
  const eContentOther = detail.querySelector(".e-content-other");
  if (eContents) {
    eContents.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
    });
  }

  const methodSel = detail.querySelector(".e-method");
  ["紙本", "平板"].forEach((m) => {
    const o = document.createElement("option"); o.value = m; o.textContent = m;
    if (m === entry.method) o.selected = true; methodSel.appendChild(o);
  });
  const statusSel = detail.querySelector(".e-status");
  ["未送件", "已送出", "待補件", "已完成"].forEach((s) => {
    const o = document.createElement("option"); o.value = s; o.textContent = s;
    if (s === entry.status) o.selected = true; statusSel.appendChild(o);
  });
  const typeSel = detail.querySelector(".e-type");
  ["新契約", "理賠", "契變", "團保"].forEach((t) => {
    const o = document.createElement("option"); o.value = t; o.textContent = t;
    if (t === entry.type) o.selected = true; typeSel.appendChild(o);
  });

  detail.querySelector(".btn-save").addEventListener("click", async () => {
    const msgEl = detail.querySelector(".e-status-msg");
    msgEl.textContent = "儲存中…"; msgEl.className = "e-status-msg status-msg";
    try {
      const newType = typeSel.value;
      let contents = [];
      if (CONTENT_OPTIONS_BY_TYPE[newType]) {
        contents = [...detail.querySelectorAll(".e-contents .chip")]
          .filter((c) => c.getAttribute("aria-pressed") === "true")
          .map((c) => c.dataset.value);
        const otherText = eContentOther ? eContentOther.value.trim() : "";
        if (otherText) contents.push("其他：" + otherText);
      }
      await updateDoc(doc(db, COLLECTION, entry.id), {
        date: detail.querySelector(".e-date").value || entry.date,
        name: detail.querySelector(".e-name").value.trim() || entry.name,
        policy: detail.querySelector(".e-policy").value.trim(),
        method: methodSel.value,
        status: statusSel.value,
        type: newType,
        contents,
        note: detail.querySelector(".e-note").value.trim(),
      });
      msgEl.textContent = "已儲存"; msgEl.className = "e-status-msg status-msg ok";
    } catch (e) {
      msgEl.textContent = "儲存失敗:" + e.message; msgEl.className = "e-status-msg status-msg err";
    }
  });
  detail.querySelector(".btn-delete").addEventListener("click", async () => {
    if (!confirm("確定要刪除「" + entry.name + "」這筆記錄嗎?")) return;
    try {
      await deleteDoc(doc(db, COLLECTION, entry.id));
    } catch (e) {
      alert("刪除失敗:" + e.message);
    }
  });

  wrap.appendChild(detail);
  return wrap;
}

function render() {
  updateStats();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = entries.filter((e) => matchesFilter(e) && matchesSearch(e));
  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = entries.length === 0 ? "還沒有送件記錄,填上面的表單開始登記。" : "沒有符合條件的記錄。";
    list.appendChild(empty);
    return;
  }
  const byDate = {};
  filtered.forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1)).forEach((date) => {
    const group = document.createElement("div");
    group.className = "day-group";
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = '<span class="date">' + date + '</span><span class="count">' + byDate[date].length + " 筆</span>";
    group.appendChild(head);
    byDate[date].forEach((entry) => group.appendChild(buildEntryCard(entry)));
    list.appendChild(group);
  });
}

function startListening() {
  if (unsubscribeList) unsubscribeList();
  const q = query(collection(db, COLLECTION), orderBy("createdAt", "desc"));
  unsubscribeList = onSnapshot(q, (snap) => {
    entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (e) => { console.error(e); });
}

window.submitGift = async function () {
  const name = document.getElementById("g-name").value.trim();
  const statusEl = document.getElementById("giftAddStatus");
  if (!name) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  const payload = {
    date: document.getElementById("g-date").value || todayISO(),
    name,
    occasion: selectedOccasion,
    gift: document.getElementById("g-gift").value.trim(),
    value: Number(document.getElementById("g-value").value) || 0,
    note: document.getElementById("g-note").value.trim(),
    createdAt: serverTimestamp(),
  };
  statusEl.textContent = "送出中…"; statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, GIFT_COLLECTION), payload);
    document.getElementById("g-name").value = "";
    document.getElementById("g-gift").value = "";
    document.getElementById("g-value").value = "";
    document.getElementById("g-note").value = "";
    document.getElementById("g-date").value = todayISO();
    [...giftOccasionChips.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
    giftOccasionChips.children[0].setAttribute("aria-pressed", "true");
    selectedOccasion = "送保單";
    statusEl.textContent = "已送出"; statusEl.className = "status-msg ok";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message; statusEl.className = "status-msg err";
  }
};

function buildGiftCard(g) {
  const wrap = document.createElement("details");
  wrap.className = "entry";
  const summary = document.createElement("summary");
  const main = document.createElement("div");
  main.className = "entry-main";
  const sub = [g.occasion];
  if (g.gift) sub.push(g.gift);
  if (g.value) sub.push("NT$ " + g.value.toLocaleString("zh-Hant"));
  main.innerHTML =
    '<div class="entry-top"><span class="entry-name">' + escapeHtml(g.name) + '</span></div>' +
    '<div class="entry-sub">' + sub.map((t) => '<span>' + escapeHtml(t) + '</span>').join("") + "</div>";
  summary.appendChild(main);
  wrap.appendChild(summary);

  const detail = document.createElement("div");
  detail.className = "entry-detail";
  detail.innerHTML =
    '<label>日期</label><input type="date" class="gd-date" value="' + g.date + '">' +
    '<label>客戶姓名</label><input type="text" class="gd-name" value="' + escapeHtml(g.name) + '">' +
    '<label>情境</label><select class="gd-occasion"></select>' +
    '<label>禮物內容</label><input type="text" class="gd-gift" value="' + escapeHtml(g.gift || "") + '">' +
    '<label>禮物價值</label><input type="number" class="gd-value" value="' + (g.value || "") + '">' +
    '<label>備註</label><textarea class="gd-note">' + escapeHtml(g.note || "") + '</textarea>' +
    '<div class="detail-actions"><button type="button" class="btn-save">儲存變更</button><button type="button" class="btn-delete">刪除</button></div>' +
    '<p class="e-status-msg status-msg"></p>';

  const occasionSel = detail.querySelector(".gd-occasion");
  ["送保單", "到府拜訪", "其他"].forEach((o) => {
    const opt = document.createElement("option"); opt.value = o; opt.textContent = o;
    if (o === g.occasion) opt.selected = true; occasionSel.appendChild(opt);
  });

  detail.querySelector(".btn-save").addEventListener("click", async () => {
    const msgEl = detail.querySelector(".e-status-msg");
    msgEl.textContent = "儲存中…"; msgEl.className = "e-status-msg status-msg";
    try {
      await updateDoc(doc(db, GIFT_COLLECTION, g.id), {
        date: detail.querySelector(".gd-date").value || g.date,
        name: detail.querySelector(".gd-name").value.trim() || g.name,
        occasion: occasionSel.value,
        gift: detail.querySelector(".gd-gift").value.trim(),
        value: Number(detail.querySelector(".gd-value").value) || 0,
        note: detail.querySelector(".gd-note").value.trim(),
      });
      msgEl.textContent = "已儲存"; msgEl.className = "e-status-msg status-msg ok";
    } catch (e) {
      msgEl.textContent = "儲存失敗:" + e.message; msgEl.className = "e-status-msg status-msg err";
    }
  });
  detail.querySelector(".btn-delete").addEventListener("click", async () => {
    if (!confirm("確定要刪除「" + g.name + "」這筆送禮記錄嗎?")) return;
    try {
      await deleteDoc(doc(db, GIFT_COLLECTION, g.id));
    } catch (e) {
      alert("刪除失敗:" + e.message);
    }
  });

  wrap.appendChild(detail);
  return wrap;
}

function renderGifts() {
  const list = document.getElementById("giftList");
  list.innerHTML = "";
  if (giftEntries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "還沒有送禮記錄。";
    list.appendChild(empty);
    return;
  }
  const byDate = {};
  giftEntries.forEach((g) => { (byDate[g.date] = byDate[g.date] || []).push(g); });
  Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1)).forEach((date) => {
    const group = document.createElement("div");
    group.className = "day-group";
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = '<span class="date">' + date + '</span><span class="count">' + byDate[date].length + " 筆</span>";
    group.appendChild(head);
    byDate[date].forEach((g) => group.appendChild(buildGiftCard(g)));
    list.appendChild(group);
  });
}

function startListeningGifts() {
  if (unsubscribeGiftList) unsubscribeGiftList();
  const q = query(collection(db, GIFT_COLLECTION), orderBy("createdAt", "desc"));
  unsubscribeGiftList = onSnapshot(q, (snap) => {
    giftEntries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderGifts();
  }, (e) => { console.error(e); });
}

window.submitCalendar = async function () {
  const name = document.getElementById("c-name").value.trim();
  const statusEl = document.getElementById("calendarAddStatus");
  if (!name) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  if (selectedCalendarItems.size === 0) { statusEl.textContent = "請至少選一個項目"; statusEl.className = "status-msg err"; return; }
  const payload = {
    date: document.getElementById("c-date").value || todayISO(),
    name,
    items: Array.from(selectedCalendarItems),
    note: document.getElementById("c-note").value.trim(),
    createdAt: serverTimestamp(),
  };
  statusEl.textContent = "送出中…"; statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, CALENDAR_COLLECTION), payload);
    document.getElementById("c-name").value = "";
    document.getElementById("c-note").value = "";
    document.getElementById("c-date").value = todayISO();
    [...calendarItemChips.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
    selectedCalendarItems.clear();
    statusEl.textContent = "已送出"; statusEl.className = "status-msg ok";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message; statusEl.className = "status-msg err";
  }
};

function getCalendarItems(c) {
  return c.items || (c.item ? [c.item] : []);
}

function buildCalendarCard(c) {
  const wrap = document.createElement("details");
  wrap.className = "entry";
  const summary = document.createElement("summary");
  const main = document.createElement("div");
  main.className = "entry-main";
  main.innerHTML =
    '<div class="entry-top"><span class="entry-name">' + escapeHtml(c.name) + '</span></div>' +
    '<div class="entry-sub"><span>' + escapeHtml(getCalendarItems(c).join("、")) + '</span></div>';
  summary.appendChild(main);
  wrap.appendChild(summary);

  const detail = document.createElement("div");
  detail.className = "entry-detail";
  detail.innerHTML =
    '<label>日期</label><input type="date" class="cd-date" value="' + c.date + '">' +
    '<label>客戶姓名</label><input type="text" class="cd-name" value="' + escapeHtml(c.name) + '">' +
    '<label>項目</label><div class="chip-group cd-items" role="group" aria-label="項目">' +
      CALENDAR_ITEMS.map((i) => '<button type="button" class="chip" data-value="' + i + '" aria-pressed="' +
        (getCalendarItems(c).includes(i) ? "true" : "false") + '">' + i + '</button>').join("") +
    '</div>' +
    '<label>備註</label><textarea class="cd-note">' + escapeHtml(c.note || "") + '</textarea>' +
    '<div class="detail-actions"><button type="button" class="btn-save">儲存變更</button><button type="button" class="btn-delete">刪除</button></div>' +
    '<p class="e-status-msg status-msg"></p>';

  const cdItems = detail.querySelector(".cd-items");
  cdItems.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });

  detail.querySelector(".btn-save").addEventListener("click", async () => {
    const msgEl = detail.querySelector(".e-status-msg");
    const items = [...cdItems.querySelectorAll(".chip")].filter((c2) => c2.getAttribute("aria-pressed") === "true").map((c2) => c2.dataset.value);
    if (items.length === 0) { msgEl.textContent = "請至少選一個項目"; msgEl.className = "e-status-msg status-msg err"; return; }
    msgEl.textContent = "儲存中…"; msgEl.className = "e-status-msg status-msg";
    try {
      await updateDoc(doc(db, CALENDAR_COLLECTION, c.id), {
        date: detail.querySelector(".cd-date").value || c.date,
        name: detail.querySelector(".cd-name").value.trim() || c.name,
        items,
        note: detail.querySelector(".cd-note").value.trim(),
      });
      msgEl.textContent = "已儲存"; msgEl.className = "e-status-msg status-msg ok";
    } catch (e) {
      msgEl.textContent = "儲存失敗:" + e.message; msgEl.className = "e-status-msg status-msg err";
    }
  });
  detail.querySelector(".btn-delete").addEventListener("click", async () => {
    if (!confirm("確定要刪除「" + c.name + "」這筆記錄嗎?")) return;
    try {
      await deleteDoc(doc(db, CALENDAR_COLLECTION, c.id));
    } catch (e) {
      alert("刪除失敗:" + e.message);
    }
  });

  wrap.appendChild(detail);
  return wrap;
}

function renderCalendarStats() {
  const row = document.getElementById("calendarStatsRow");
  row.innerHTML = CALENDAR_ITEMS.map((item) => {
    const count = calendarEntries.filter((c) => getCalendarItems(c).includes(item)).length;
    return '<div class="stat-tile"><div class="num">' + count + '</div><div class="label">' + item + '</div></div>';
  }).join("");
}

function renderCalendarList() {
  renderCalendarStats();
  const list = document.getElementById("calendarList");
  list.innerHTML = "";
  if (calendarEntries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "還沒有記錄。";
    list.appendChild(empty);
    return;
  }
  const byDate = {};
  calendarEntries.forEach((c) => { (byDate[c.date] = byDate[c.date] || []).push(c); });
  Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1)).forEach((date) => {
    const group = document.createElement("div");
    group.className = "day-group";
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = '<span class="date">' + date + '</span><span class="count">' + byDate[date].length + " 筆</span>";
    group.appendChild(head);
    byDate[date].forEach((c) => group.appendChild(buildCalendarCard(c)));
    list.appendChild(group);
  });
}

function startListeningCalendar() {
  if (unsubscribeCalendarList) unsubscribeCalendarList();
  const q = query(collection(db, CALENDAR_COLLECTION), orderBy("createdAt", "desc"));
  unsubscribeCalendarList = onSnapshot(q, (snap) => {
    calendarEntries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderCalendarList();
  }, (e) => { console.error(e); });
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    startListening();
    startListeningGifts();
    startListeningCalendar();
  } else {
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
  }
});

window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "登入中…"; statusEl.className = "status-msg";
  try {
    await signInWithEmailAndPassword(auth, email, password);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "登入失敗:" + e.message; statusEl.className = "status-msg err";
  }
};
window.doLogout = function () { signOut(auth); };

function toCsvField(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function inMonthRange(dateStr, from, to) {
  if (!dateStr) return false;
  const m = dateStr.slice(0, 7);
  return m >= from && m <= to;
}

function downloadCsv(filename, header, rows) {
  const csv = "﻿" + header.join(",") + "\n" + rows.map((r) => r.map(toCsvField).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getMonthRange(fromId, toId) {
  const from = document.getElementById(fromId).value;
  const to = document.getElementById(toId).value;
  if (!from || !to) { alert("請先選擇起訖月份"); return null; }
  if (from > to) { alert("起始月份不能晚於結束月份"); return null; }
  return { from, to };
}

window.exportMonth = function () {
  const range = getMonthRange("exportMonthFrom", "exportMonthTo");
  if (!range) return;
  const rows = entries
    .filter((e) => inMonthRange(e.date, range.from, range.to))
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((e) => [e.date, e.name, e.type, e.policy, e.method, e.status, (e.contents || []).join("、"), e.note]);
  if (rows.length === 0) { alert(range.from + " ~ " + range.to + " 這段期間沒有送件記錄"); return; }
  const header = ["送件日期", "客戶姓名", "案件類型", "保單號碼", "送件方式", "狀態", "送件內容", "備註"];
  downloadCsv("送件日誌_" + range.from + "_" + range.to + ".csv", header, rows);
};

window.exportGiftMonth = function () {
  const range = getMonthRange("giftExportMonthFrom", "giftExportMonthTo");
  if (!range) return;
  const rows = giftEntries
    .filter((g) => inMonthRange(g.date, range.from, range.to))
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((g) => [g.date, g.name, g.occasion, g.gift, g.value || "", g.note]);
  if (rows.length === 0) { alert(range.from + " ~ " + range.to + " 這段期間沒有送禮記錄"); return; }
  const header = ["日期", "客戶姓名", "情境", "禮物內容", "禮物價值", "備註"];
  downloadCsv("送禮記錄_" + range.from + "_" + range.to + ".csv", header, rows);
};

window.exportCalendarMonth = function () {
  const range = getMonthRange("calendarExportMonthFrom", "calendarExportMonthTo");
  if (!range) return;
  const rows = calendarEntries
    .filter((c) => inMonthRange(c.date, range.from, range.to))
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((c) => [c.date, c.name, getCalendarItems(c).join("、"), c.note]);
  if (rows.length === 0) { alert(range.from + " ~ " + range.to + " 這段期間沒有記錄"); return; }
  const header = ["日期", "客戶姓名", "項目", "備註"];
  downloadCsv("年曆_" + range.from + "_" + range.to + ".csv", header, rows);
};
