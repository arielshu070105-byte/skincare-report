<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>理賠險種資料庫</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="icon" href="../insurance/icon-32.png">
<link rel="apple-touch-icon" href="../insurance/icon-180.png">
<meta name="theme-color" content="#f4f4f5">
<script>
(function () {
  try {
    var saved = localStorage.getItem("charis-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(232,232,235,0.55) 100%);
    --card-border: rgba(0,0,0,0.07);
    --ink: #1c1c1e;
    --ink-soft: #8e8e93;
    --line: rgba(0,0,0,0.08);
    --input-bg: rgba(255,255,255,0.6);
    --pill-bg: rgba(0,0,0,0.05);
    --accent: #1c1c1e;
    --accent-soft: rgba(28,28,30,0.08);
    --accent-ink: #ffffff;
    --accent-shadow: rgba(0,0,0,0.22);
    --radius: 26px;
    --shadow: 0 20px 40px rgba(0,0,0,0.09), 0 2px 8px rgba(0,0,0,0.05);
    --danger: #e0796f;
    --ok: #6fb98f;
    --blur: blur(20px) saturate(140%);
    --glow-1: rgba(0,0,0,0.045);
    --glow-2: rgba(0,0,0,0.03);
    --glow-3: rgba(0,0,0,0.035);
    --stamp-grey: #8e8e93; --stamp-grey-bg: rgba(142,142,147,0.14);
    --stamp-amber: #b8863f; --stamp-amber-bg: rgba(184,134,63,0.14);
    --stamp-red: #c0564a; --stamp-red-bg: rgba(192,86,74,0.14);
    --stamp-green: #4a9165; --stamp-green-bg: rgba(74,145,101,0.14);
  }
  [data-theme="dark"] {
    --bg: #0c0c0d;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
    --card-border: rgba(255,255,255,0.1);
    --ink: #f2f2f3;
    --ink-soft: #98989d;
    --line: rgba(255,255,255,0.1);
    --input-bg: rgba(255,255,255,0.08);
    --pill-bg: rgba(255,255,255,0.06);
    --accent: #f2f2f3;
    --accent-soft: rgba(255,255,255,0.12);
    --accent-ink: #0c0c0d;
    --accent-shadow: rgba(0,0,0,0.6);
    --shadow: 0 20px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
    --glow-1: rgba(255,255,255,0.06);
    --glow-2: rgba(255,255,255,0.04);
    --glow-3: rgba(255,255,255,0.05);
    --stamp-grey: #a3aebb; --stamp-grey-bg: rgba(163,174,187,0.16);
    --stamp-amber: #dcb24d; --stamp-amber-bg: rgba(220,178,77,0.16);
    --stamp-red: #e0847a; --stamp-red-bg: rgba(224,132,122,0.16);
    --stamp-green: #7fc498; --stamp-green-bg: rgba(127,196,152,0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(45% 38% at 15% 0%, var(--glow-1) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(50% 42% at 100% 25%, var(--glow-2) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(55% 45% at 10% 100%, var(--glow-3) 0%, rgba(0,0,0,0) 70%);
    background-attachment: fixed; background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shell { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; }
  h2 { font-size: 16px; font-weight: 900; margin: 0 0 14px; letter-spacing: 0.04em; color: var(--accent); }
  p { line-height: 1.6; color: var(--ink-soft); font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 14px 0 6px; letter-spacing: 0.03em; }
  input, textarea, select {
    width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink);
  }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary { width: 100%; min-height: 50px; padding: 15px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; margin-top: 18px; letter-spacing: 0.03em; box-shadow: 0 12px 28px var(--accent-shadow); transition: transform 0.1s ease; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost { background: none; color: var(--accent); padding: 10px; font-size: 13px; font-weight: 700; width: 100%; margin-top: 2px; min-height: 40px; }
  .btn-sm { padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
  .center-screen { padding: 56px 0 0; }
  .brand-wordmark { font-size: 24px; font-weight: 900; letter-spacing: 0.06em; color: var(--ink); margin-bottom: 2px; }
  .brand-subtitle { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 16px; }
  .theme-switch { width: 44px; height: 24px; border-radius: 999px; background: var(--pill-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: flex-start; padding: 2px; flex-shrink: 0; }
  [data-theme="dark"] .theme-switch { justify-content: flex-end; }
  .theme-switch-knob { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(111,185,143,0.7); }
  .status-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px 14px; border-radius: 999px; display: none; }
  .status-msg:not(:empty) { display: block; background: var(--input-bg); color: var(--ink-soft); }
  .status-msg.ok { background: rgba(111,185,143,0.2); color: var(--ok); font-weight: 700; }
  .status-msg.err { background: rgba(224,121,111,0.16); color: var(--danger); font-weight: 700; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .tab-view { display: none; }
  .tab-view.active { display: block; }

  .greeting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .greeting-hello { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .greeting-name { font-size: 19px; font-weight: 900; color: var(--ink); line-height: 1.25; }
  .greeting-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
  .greeting-right-top { display: flex; align-items: center; gap: 6px; }
  .header-icon-btn { width: 26px; height: 26px; border-radius: 50%; background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; padding: 0; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; margin-bottom: 18px; }
  .stat-tile { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .stat-tile[role="button"] { cursor: pointer; }
  .stat-tile .num { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.1; }
  .stat-tile.warn .num { color: var(--danger); }
  .stat-tile .num.money { font-size: 17px; line-height: 1.55; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-tile .label { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .export-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .export-row input[type="month"] { flex: 1; min-width: 120px; margin: 0; min-height: 44px; }
  .export-row .export-range-sep { color: var(--ink-soft); font-size: 13px; }
  .export-row button { flex-shrink: 0; white-space: nowrap; min-height: 44px; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--card-border); background: var(--input-bg); color: var(--ink-soft); font-size: 13.5px; padding: 8px 14px; border-radius: 999px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .stamp { display: inline-block; font-size: 11px; letter-spacing: 0.02em; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .stamp.rs-已理賠 { color: var(--stamp-green); background: var(--stamp-green-bg); }
  .stamp.rs-部分理賠 { color: var(--stamp-amber); background: var(--stamp-amber-bg); }
  .stamp.rs-拒賠 { color: var(--stamp-red); background: var(--stamp-red-bg); }
  .stamp.rs-審核中 { color: var(--stamp-grey); background: var(--stamp-grey-bg); }

  /* 查詢結果:依商品分組,每個病名一列 */
  .product-group { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .product-group:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .product-name { font-weight: 900; font-size: 15px; color: var(--ink); margin-bottom: 8px; }
  .product-name .count { font-weight: 500; font-size: 12px; color: var(--ink-soft); margin-left: 6px; }
  .disease-row { background: var(--pill-bg); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .disease-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .disease-name { font-weight: 700; font-size: 14px; color: var(--ink); }
  .disease-stamps { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .disease-cases { margin-top: 6px; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
  .disease-cases .case-note { color: var(--ink); }

  .client-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; text-align: left; padding: 12px 2px; border-bottom: 1px solid var(--line); color: var(--ink); }
  .client-row:last-child { border-bottom: none; }
  .client-row .c-name { font-weight: 700; font-size: 14.5px; }
  .client-row .c-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .client-row .c-amount { font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .client-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 15px; padding: 12px 2px 4px; border-top: 2px solid var(--line); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .claim-line { background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 4px 12px 12px; margin-bottom: 10px; position: relative; }
  .claim-line .remove-line-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--danger); font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .claim-line .line-title { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 10px 0 0; }

  .entry { border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; }
  .entry > summary { list-style: none; cursor: pointer; padding: 12px 0; }
  .entry > summary::-webkit-details-marker { display: none; }
  .entry-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .entry-name { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .entry-sub { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink-soft); }
  .entry-detail { padding: 0 0 16px; display: flex; flex-direction: column; }
  .detail-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn-save, .btn-delete { flex: 1; border-radius: 999px; padding: 11px; font-size: 13.5px; font-weight: 700; }
  .btn-save { background: var(--accent); color: var(--accent-ink); }
  .btn-delete { background: rgba(224,121,111,0.14); color: var(--danger); }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 24px 10px; }

  #loginScreen, #app { display: none; }
</style>
</head>
<body>
<div id="shell">

  <div id="loginScreen" class="center-screen">
    <div class="brand-wordmark">TG全球人壽</div>
    <div class="brand-subtitle">理賠險種資料庫</div>
    <p>用跟送件日誌一樣的帳號登入</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">登入</button>
    <p id="loginStatus" class="status-msg"></p>
  </div>

  <div id="app">
    <div class="greeting-row">
      <div>
        <div class="greeting-hello">理賠險種資料庫</div>
        <div class="greeting-name">TG全球人壽</div>
      </div>
      <div class="greeting-right">
        <div class="greeting-right-top">
          <button class="header-icon-btn" onclick="doLogout()" title="登出">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
          <button class="theme-switch" onclick="toggleTheme()" title="切換深色/淺色主題"><span class="theme-switch-knob"></span></button>
        </div>
        <div class="status-dot" title="即時同步中"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-tile warn" id="statPendingTile" onclick="showPending()" role="button" tabindex="0"><div class="num" id="statPending">0</div><div class="label">審核中</div></div>
      <div class="stat-tile"><div class="num" id="statTotal">0</div><div class="label">全部記錄</div></div>
      <div class="stat-tile"><div class="num money" id="statPaid">0</div><div class="label">已理賠金額</div></div>
    </div>

    <div class="chip-group" id="pageTabs" role="group" aria-label="頁面切換" style="margin-bottom:18px">
      <button type="button" class="chip" data-tab="search" aria-pressed="true">查詢</button>
      <button type="button" class="chip" data-tab="add" aria-pressed="false">新增理賠</button>
      <button type="button" class="chip" data-tab="list" aria-pressed="false">全部記錄</button>
      <button type="button" class="chip" data-tab="clients" aria-pressed="false">客戶統計</button>
    </div>

    <div class="tab-view" id="tabClients">
    <div class="card">
      <h2>客戶理賠金額</h2>
      <p style="margin:-6px 0 12px;font-size:12.5px">只加總「已理賠」和「部分理賠」的金額。點客戶可以看他的理賠明細。</p>
      <div id="clientStats"></div>
    </div>
    </div>

    <div class="tab-view active" id="tabSearch">
    <div class="card">
      <h2>這個商品能不能賠?</h2>
      <label for="qProduct">商品名稱</label>
      <input type="text" id="qProduct" list="productOptions" placeholder="打幾個字就好,例如:醫療">
      <label for="qDisease">病名 / 事故</label>
      <input type="text" id="qDisease" list="diseaseOptions" placeholder="例如:腎結石、骨折">
      <div style="margin-top:18px" id="searchResults"></div>
    </div>
    </div>

    <div class="tab-view" id="tabAdd">
    <div class="card">
      <h2>新增理賠記錄</h2>
      <div class="field-row">
        <div><label for="a-date">送件日期</label><input type="date" id="a-date"></div>
        <div><label for="a-name">客戶姓名</label><input type="text" id="a-name" placeholder="選填"></div>
      </div>
      <label for="a-disease">病名 / 事故</label>
      <input type="text" id="a-disease" list="diseaseOptions" placeholder="例如:腎結石">
      <label>理賠的商品(同一次理賠動用多張保單,就按「+ 加一個商品」)</label>
      <div id="claimLines"></div>
      <button type="button" class="btn-ghost" onclick="addClaimLine()">+ 加一個商品</button>
      <button class="btn-primary" onclick="submitClaim()">送出記錄</button>
      <p id="addStatus" class="status-msg"></p>
    </div>
    </div>

    <div class="tab-view" id="tabList">
    <div class="card">
      <h2>全部理賠記錄</h2>
      <div class="export-row">
        <input type="month" id="exportMonthFrom">
        <span class="export-range-sep">至</span>
        <input type="month" id="exportMonthTo">
        <button type="button" class="btn-sm" onclick="exportMonth()">匯出 Excel</button>
      </div>
      <div class="filter-row" id="resultFilter" role="group" aria-label="依結果篩選">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="chip" data-filter="審核中" aria-pressed="false">審核中</button>
        <button type="button" class="chip" data-filter="已理賠" aria-pressed="false">已理賠</button>
        <button type="button" class="chip" data-filter="部分理賠" aria-pressed="false">部分理賠</button>
        <button type="button" class="chip" data-filter="拒賠" aria-pressed="false">拒賠</button>
      </div>
      <input type="text" id="listSearch" placeholder="搜尋客戶、商品、病名…" style="margin-bottom:14px">
      <div id="list"></div>
    </div>
    </div>
  </div>

  <datalist id="productOptions"></datalist>
  <datalist id="diseaseOptions"></datalist>
</div>

<script type="module">
import { initFirebase } from "../insurance/firebase-init.js";
import { escapeHtml, todayISO } from "../insurance/shared.js";
import {
  collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const { db, auth } = initFirebase();
const COLLECTION = "claimCases";
const RESULTS = ["已理賠", "部分理賠", "拒賠", "審核中"];
// 理賠項目清單,要增減直接改這裡
const CLAIM_ITEMS = ["住院日額", "實支實付", "手術", "門診", "癌症", "重大疾病", "意外醫療", "失能", "身故"];

let entries = [];
let unsubscribeList = null;

window.toggleTheme = function () {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("charis-theme", next); } catch (e) {}
};

document.getElementById("a-date").value = todayISO();
document.getElementById("exportMonthFrom").value = todayISO().slice(0, 7);
document.getElementById("exportMonthTo").value = todayISO().slice(0, 7);

const pageTabs = document.getElementById("pageTabs");
pageTabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  [...pageTabs.children].forEach((c) => c.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  document.getElementById("tabSearch").classList.toggle("active", btn.dataset.tab === "search");
  document.getElementById("tabAdd").classList.toggle("active", btn.dataset.tab === "add");
  document.getElementById("tabList").classList.toggle("active", btn.dataset.tab === "list");
  document.getElementById("tabClients").classList.toggle("active", btn.dataset.tab === "clients");
});

// 比對時忽略空白跟大小寫,打「醫療」也能找到「XX醫療終身保險」
function norm(s) { return String(s || "").replace(/\s+/g, "").toLowerCase(); }

function chipsHtml(options, selected, cls) {
  return '<div class="chip-group ' + cls + '">' + options.map((o) =>
    '<button type="button" class="chip" data-value="' + escapeHtml(o) + '" aria-pressed="' + (selected.includes(o) ? "true" : "false") + '">' + escapeHtml(o) + '</button>'
  ).join("") + '</div>';
}
function selectHtml(options, selected, cls) {
  return '<select class="' + cls + '">' + options.map((o) =>
    '<option' + (o === selected ? " selected" : "") + '>' + o + '</option>').join("") + '</select>';
}
function bindMultiChips(container) {
  container.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip-group .chip");
    if (!btn) return;
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });
}
function pressedValues(container, cls) {
  return [...container.querySelectorAll("." + cls + " .chip")]
    .filter((c) => c.getAttribute("aria-pressed") === "true").map((c) => c.dataset.value);
}

// 一個商品一個區塊,各自有理賠項目/結果/金額
function claimFieldsHtml(c) {
  return '<label>商品名稱</label><input type="text" class="cl-product" list="productOptions" value="' + escapeHtml(c.product || "") + '" placeholder="例如:XX醫療終身保險">' +
    '<label>理賠項目</label>' + chipsHtml(CLAIM_ITEMS, c.items || [], "cl-items") +
    '<div class="field-row"><div><label>結果</label>' + selectHtml(RESULTS, c.result || "已理賠", "cl-result") + '</div>' +
    '<div><label>理賠金額</label><input type="number" class="cl-amount" inputmode="numeric" placeholder="選填" value="' + (c.amount || "") + '"></div></div>' +
    '<label>備註(拒賠原因、補件內容…)</label><textarea class="cl-note" placeholder="選填">' + escapeHtml(c.note || "") + '</textarea>';
}
function readClaimFields(el) {
  return {
    product: el.querySelector(".cl-product").value.trim(),
    items: pressedValues(el, "cl-items"),
    result: el.querySelector(".cl-result").value,
    amount: Number(el.querySelector(".cl-amount").value) || 0,
    note: el.querySelector(".cl-note").value.trim(),
  };
}

const claimLines = document.getElementById("claimLines");
bindMultiChips(claimLines);
window.addClaimLine = function () {
  const row = document.createElement("div");
  row.className = "claim-line";
  row.innerHTML = '<div class="line-title"></div>' + claimFieldsHtml({}) +
    '<button type="button" class="remove-line-btn" title="移除">×</button>';
  row.querySelector(".remove-line-btn").addEventListener("click", () => { row.remove(); renumberLines(); });
  claimLines.appendChild(row);
  renumberLines();
};
function renumberLines() {
  const rows = [...claimLines.children];
  rows.forEach((r, i) => {
    r.querySelector(".line-title").textContent = "商品 " + (i + 1);
    r.querySelector(".remove-line-btn").style.display = rows.length > 1 ? "flex" : "none";
  });
}
addClaimLine();

window.submitClaim = async function () {
  const statusEl = document.getElementById("addStatus");
  const disease = document.getElementById("a-disease").value.trim();
  const lines = [...claimLines.children].map(readClaimFields).filter((l) => l.product);
  if (!disease) { statusEl.textContent = "請填病名 / 事故"; statusEl.className = "status-msg err"; return; }
  if (!lines.length) { statusEl.textContent = "請至少填一個商品名稱"; statusEl.className = "status-msg err"; return; }
  const base = {
    date: document.getElementById("a-date").value || todayISO(),
    name: document.getElementById("a-name").value.trim(),
    disease,
    // 同一次送件的多個商品共用 claimId,全部記錄才能合併成一筆顯示
    claimId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  };
  statusEl.textContent = "送出中…"; statusEl.className = "status-msg";
  try {
    for (const l of lines) {
      await addDoc(collection(db, COLLECTION), { ...base, ...l, createdAt: serverTimestamp() });
    }
    document.getElementById("a-name").value = "";
    document.getElementById("a-disease").value = "";
    document.getElementById("a-date").value = todayISO();
    claimLines.innerHTML = "";
    addClaimLine();
    statusEl.textContent = "已送出"; statusEl.className = "status-msg ok";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message; statusEl.className = "status-msg err";
  }
};

function refreshDatalists() {
  const fill = (id, values) => {
    document.getElementById(id).innerHTML = [...new Set(values.filter(Boolean))].sort()
      .map((v) => '<option value="' + escapeHtml(v) + '"></option>').join("");
  };
  fill("productOptions", entries.map((e) => e.product));
  fill("diseaseOptions", entries.map((e) => e.disease));
}

// ---- 查詢 ----
const qProduct = document.getElementById("qProduct");
const qDisease = document.getElementById("qDisease");
qProduct.addEventListener("input", renderSearch);
qDisease.addEventListener("input", renderSearch);

function renderSearch() {
  const out = document.getElementById("searchResults");
  const p = norm(qProduct.value), d = norm(qDisease.value);
  if (!p && !d) {
    out.innerHTML = '<div class="empty">輸入商品或病名,就會列出以前同樣情況的理賠結果。<br>目前資料庫共 ' + entries.length + ' 筆。</div>';
    return;
  }
  const matched = entries.filter((e) => (!p || norm(e.product).includes(p)) && (!d || norm(e.disease).includes(d)));
  if (!matched.length) {
    out.innerHTML = '<div class="empty">還沒有符合的理賠記錄。</div>';
    return;
  }
  const byProduct = {};
  matched.forEach((e) => {
    const g = (byProduct[e.product] = byProduct[e.product] || {});
    (g[e.disease] = g[e.disease] || []).push(e);
  });
  out.innerHTML = Object.keys(byProduct).sort().map((product) => {
    const diseases = byProduct[product];
    const total = Object.values(diseases).reduce((s, arr) => s + arr.length, 0);
    return '<div class="product-group"><div class="product-name">' + escapeHtml(product) + '<span class="count">' + total + ' 筆</span></div>' +
      Object.keys(diseases).sort().map((disease) => {
        const cases = diseases[disease].slice().sort((a, b) => (a.date < b.date ? 1 : -1));
        const counts = {};
        cases.forEach((c) => { counts[c.result] = (counts[c.result] || 0) + 1; });
        const stamps = RESULTS.filter((r) => counts[r]).map((r) =>
          '<span class="stamp rs-' + r + '">' + r + ' ' + counts[r] + '</span>').join("");
        const lines = cases.map((c) => {
          const bits = [c.date];
          if (c.name) bits.push(escapeHtml(c.name));
          bits.push(c.result);
          if (c.items && c.items.length) bits.push(escapeHtml(c.items.join("、")));
          if (c.amount) bits.push("NT$ " + c.amount.toLocaleString("zh-Hant"));
          return '<div>' + bits.join(" · ") + (c.note ? ' — <span class="case-note">' + escapeHtml(c.note) + '</span>' : "") + '</div>';
        }).join("");
        return '<div class="disease-row"><div class="disease-top"><span class="disease-name">' + escapeHtml(disease) +
          '</span><span class="disease-stamps">' + stamps + '</span></div><div class="disease-cases">' + lines + '</div></div>';
      }).join("") + '</div>';
  }).join("");
}

// ---- 全部記錄 ----
let listTerm = "";
let activeResult = "all";
document.getElementById("listSearch").addEventListener("input", (e) => { listTerm = norm(e.target.value); renderList(); });

const resultFilter = document.getElementById("resultFilter");
function setResultFilter(value) {
  [...resultFilter.children].forEach((c) => c.setAttribute("aria-pressed", c.dataset.filter === value ? "true" : "false"));
  activeResult = value;
  renderList();
}
resultFilter.addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (btn) setResultFilter(btn.dataset.filter);
});

// 點「審核中」數字 → 跳到全部記錄並只顯示審核中
window.showPending = function () {
  [...pageTabs.children].find((c) => c.dataset.tab === "list").click();
  setResultFilter("審核中");
};
document.getElementById("statPendingTile").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); window.showPending(); }
});

// 一次送件(同客戶、同病名)動用多個商品時,資料庫裡是多份文件,這裡合併回一筆。
// 舊資料沒有 claimId,用 日期+姓名+病名 當作同一次送件
function groupClaims() {
  const groups = {};
  entries.forEach((e) => {
    const key = e.claimId || [e.date, e.name, e.disease].join("|");
    (groups[key] = groups[key] || { date: e.date, name: e.name, disease: e.disease, products: [] }).products.push(e);
  });
  return Object.values(groups);
}

function updateStats() {
  const claims = groupClaims();
  document.getElementById("statPending").textContent = claims.filter((c) => c.products.some((p) => p.result === "審核中")).length;
  document.getElementById("statTotal").textContent = claims.length;
  // 已理賠 + 部分理賠 的金額加總(拒賠/審核中不算)
  const paid = entries.filter((e) => e.result === "已理賠" || e.result === "部分理賠").reduce((s, e) => s + (e.amount || 0), 0);
  document.getElementById("statPaid").textContent = "$" + paid.toLocaleString("zh-Hant");
}

function buildClaimCard(claim) {
  const wrap = document.createElement("details");
  wrap.className = "entry";
  const results = RESULTS.filter((r) => claim.products.some((p) => p.result === r));
  const sent = claim.products.map((p) => p.product + (claim.products.length > 1 ? "(" + p.result + ")" : "")).join("、");
  const claimPaid = claim.products.reduce((s, p) => s + (p.amount || 0), 0);
  wrap.innerHTML = '<summary><div class="entry-top"><span class="entry-name">' + escapeHtml(claim.name || "(未填姓名)") + '</span>' +
    '<span class="disease-stamps">' + results.map((r) => '<span class="stamp rs-' + r + '">' + r + '</span>').join("") + '</span></div>' +
    '<div class="entry-sub"><span>' + escapeHtml(claim.date) + '</span><span>' + escapeHtml(claim.disease) + '</span>' +
    (claimPaid ? '<span>理賠 NT$ ' + claimPaid.toLocaleString("zh-Hant") + '</span>' : '') + '</div>' +
    '<div class="entry-sub"><span>送出:' + escapeHtml(sent) + '</span></div></summary>';

  const detail = document.createElement("div");
  detail.className = "entry-detail";
  detail.innerHTML =
    '<div class="field-row"><div><label>送件日期</label><input type="date" class="e-date" value="' + claim.date + '"></div>' +
    '<div><label>客戶姓名</label><input type="text" class="e-name" value="' + escapeHtml(claim.name || "") + '"></div></div>' +
    '<label>病名 / 事故</label><input type="text" class="e-disease" list="diseaseOptions" value="' + escapeHtml(claim.disease) + '">' +
    '<div style="margin-top:14px">' + claim.products.map((p, i) =>
      '<div class="claim-line" data-id="' + p.id + '"><div class="line-title">商品 ' + (i + 1) + '</div>' + claimFieldsHtml(p) + '</div>').join("") + '</div>' +
    '<div class="detail-actions"><button type="button" class="btn-save">儲存變更</button><button type="button" class="btn-delete">刪除</button></div>' +
    '<p class="e-status-msg status-msg"></p>';
  bindMultiChips(detail);

  detail.querySelector(".btn-save").addEventListener("click", async () => {
    const msgEl = detail.querySelector(".e-status-msg");
    const shared = {
      date: detail.querySelector(".e-date").value || claim.date,
      name: detail.querySelector(".e-name").value.trim(),
      disease: detail.querySelector(".e-disease").value.trim() || claim.disease,
    };
    msgEl.textContent = "儲存中…"; msgEl.className = "e-status-msg status-msg";
    try {
      for (const block of detail.querySelectorAll(".claim-line")) {
        const original = claim.products.find((p) => p.id === block.dataset.id);
        const fields = readClaimFields(block);
        await updateDoc(doc(db, COLLECTION, original.id), { ...fields, ...shared, product: fields.product || original.product });
      }
      msgEl.textContent = "已儲存"; msgEl.className = "e-status-msg status-msg ok";
    } catch (e) {
      msgEl.textContent = "儲存失敗:" + e.message; msgEl.className = "e-status-msg status-msg err";
    }
  });
  detail.querySelector(".btn-delete").addEventListener("click", async () => {
    const label = (claim.name || "未填姓名") + " / " + claim.disease;
    if (!confirm("確定要刪除「" + label + "」這筆記錄嗎?(" + claim.products.length + " 個商品會一起刪除)")) return;
    try {
      for (const p of claim.products) await deleteDoc(doc(db, COLLECTION, p.id));
    } catch (e) { alert("刪除失敗:" + e.message); }
  });

  wrap.appendChild(detail);
  return wrap;
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = groupClaims().filter((c) =>
    (activeResult === "all" || c.products.some((p) => p.result === activeResult)) &&
    (!listTerm || [c.name, c.disease, ...c.products.flatMap((p) => [p.product, p.note])].some((v) => norm(v).includes(listTerm))));
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">' + (entries.length ? "沒有符合條件的記錄。" : "還沒有理賠記錄,到「新增理賠」開始登記。") + '</div>';
    return;
  }
  filtered.sort((a, b) => (a.date < b.date ? 1 : -1)).forEach((c) => list.appendChild(buildClaimCard(c)));
}

// ---- 客戶統計 ----
function renderClientStats() {
  const out = document.getElementById("clientStats");
  if (!entries.length) { out.innerHTML = '<div class="empty">還沒有理賠記錄。</div>'; return; }
  const byClient = {};
  groupClaims().forEach((c) => {
    const key = c.name || "";
    const s = (byClient[key] = byClient[key] || { name: key, claims: 0, paid: 0, pending: 0 });
    s.claims += 1;
    c.products.forEach((p) => {
      if (p.result === "已理賠" || p.result === "部分理賠") s.paid += p.amount || 0;
    });
    if (c.products.some((p) => p.result === "審核中")) s.pending += 1;
  });
  const rows = Object.values(byClient).sort((a, b) => b.paid - a.paid || b.claims - a.claims);
  const total = rows.reduce((s, r) => s + r.paid, 0);
  out.innerHTML = rows.map((r) =>
    '<button type="button" class="client-row" data-name="' + escapeHtml(r.name) + '"><div><div class="c-name">' + escapeHtml(r.name || "(未填姓名)") + '</div>' +
    '<div class="c-sub">理賠 ' + r.claims + ' 次' + (r.pending ? ' · 審核中 ' + r.pending : '') + '</div></div>' +
    '<div class="c-amount">NT$ ' + r.paid.toLocaleString("zh-Hant") + '</div></button>').join("") +
    '<div class="client-total"><span>' + rows.length + ' 位客戶合計</span><span>NT$ ' + total.toLocaleString("zh-Hant") + '</span></div>';
}
document.getElementById("clientStats").addEventListener("click", (e) => {
  const row = e.target.closest(".client-row");
  if (!row || !row.dataset.name) return;
  [...pageTabs.children].find((c) => c.dataset.tab === "list").click();
  document.getElementById("listSearch").value = row.dataset.name;
  listTerm = norm(row.dataset.name);
  setResultFilter("all");
});

function startListening() {
  if (unsubscribeList) unsubscribeList();
  const q = query(collection(db, COLLECTION), orderBy("createdAt", "desc"));
  unsubscribeList = onSnapshot(q, (snap) => {
    entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    refreshDatalists();
    updateStats();
    renderClientStats();
    renderSearch();
    renderList();
  }, (e) => {
    console.error(e);
    document.getElementById("searchResults").innerHTML = '<div class="empty">讀取失敗:' + escapeHtml(e.message) + '</div>';
  });
}

onAuthStateChanged(auth, (user) => {
  document.getElementById("loginScreen").style.display = user ? "none" : "block";
  document.getElementById("app").style.display = user ? "block" : "none";
  if (user) startListening();
});

window.doLogin = async function () {
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "登入中…"; statusEl.className = "status-msg";
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "登入失敗:" + e.message; statusEl.className = "status-msg err";
  }
};
window.doLogout = function () { signOut(auth); };

function toCsvField(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
window.exportMonth = function () {
  const from = document.getElementById("exportMonthFrom").value;
  const to = document.getElementById("exportMonthTo").value;
  if (!from || !to) { alert("請先選擇起訖月份"); return; }
  if (from > to) { alert("起始月份不能晚於結束月份"); return; }
  const header = ["送件日期", "客戶姓名", "病名/事故", "商品名稱", "理賠項目", "結果", "理賠金額", "備註"];
  const rows = entries
    .filter((e) => e.date && e.date.slice(0, 7) >= from && e.date.slice(0, 7) <= to)
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((e) => [e.date, e.name, e.disease, e.product, (e.items || []).join("、"), e.result, e.amount || "", e.note]);
  const csv = "﻿" + header.join(",") + "\n" + rows.map((r) => r.map(toCsvField).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  const a = document.createElement("a");
  a.href = url; a.download = "理賠資料庫_" + from + "_" + to + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>
