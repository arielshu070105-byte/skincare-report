<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>CHARIS Inventory Management</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f4f4f5" id="metaThemeColor">
<script>
(function () {
  try {
    var saved = localStorage.getItem("charis-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(232,232,235,0.55) 100%);
    --card-border: rgba(0,0,0,0.07);
    --ink: #1c1c1e;
    --ink-soft: #8e8e93;
    --line: rgba(0,0,0,0.08);
    --input-bg: rgba(255,255,255,0.6);
    --sheet-bg: rgba(255,255,255,0.94);
    --nav-bg: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(228,228,231,0.55) 100%);
    --pill-bg: rgba(0,0,0,0.05);
    --pill-active-bg: rgba(255,255,255,0.95);
    --accent: #1c1c1e;
    --accent-soft: rgba(28,28,30,0.08);
    --accent-ink: #ffffff;
    --accent-shadow: rgba(0,0,0,0.22);
    --overlay-scrim: rgba(0,0,0,0.35);
    --radius: 26px;
    --shadow: 0 20px 40px rgba(0,0,0,0.09), 0 2px 8px rgba(0,0,0,0.05);
    --danger: #e0796f;
    --ok: #6fb98f;
    --blur: blur(20px) saturate(140%);
    --glow-1: rgba(0,0,0,0.045);
    --glow-2: rgba(0,0,0,0.03);
    --glow-3: rgba(0,0,0,0.035);
  }
  [data-theme="dark"] {
    --bg: #0c0c0d;
    --card-bg: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
    --card-border: rgba(255,255,255,0.1);
    --ink: #f2f2f3;
    --ink-soft: #98989d;
    --line: rgba(255,255,255,0.1);
    --input-bg: rgba(255,255,255,0.08);
    --sheet-bg: rgba(30,30,32,0.97);
    --nav-bg: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    --pill-bg: rgba(255,255,255,0.06);
    --pill-active-bg: rgba(255,255,255,0.16);
    --accent: #f2f2f3;
    --accent-soft: rgba(255,255,255,0.12);
    --accent-ink: #0c0c0d;
    --accent-shadow: rgba(0,0,0,0.6);
    --overlay-scrim: rgba(0,0,0,0.55);
    --shadow: 0 20px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
    --glow-1: rgba(255,255,255,0.06);
    --glow-2: rgba(255,255,255,0.04);
    --glow-3: rgba(255,255,255,0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(45% 38% at 15% 0%, var(--glow-1) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(50% 42% at 100% 25%, var(--glow-2) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(55% 45% at 10% 100%, var(--glow-3) 0%, rgba(0,0,0,0) 70%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  #shell { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; position: relative; }
  h1 { font-size: 22px; font-weight: 900; margin: 0 0 4px; letter-spacing: 0.02em; color: var(--ink); }
  h2 { font-size: 16px; font-weight: 900; margin: 0 0 14px; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
  p { line-height: 1.6; color: var(--ink-soft); font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 14px 0 6px; letter-spacing: 0.03em; }
  input, textarea {
    width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  input[type="number"], input.qty-input {
    width: 100%; min-height: 48px; font-family: inherit; font-size: 15px;
    appearance: auto; -webkit-appearance: auto;
    background: initial; border: initial; border-radius: initial; padding: 8px; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .picker-trigger {
    width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink); text-align: left;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .picker-trigger.placeholder { color: var(--ink-soft); }
  .picker-trigger .chevron { color: var(--ink-soft); font-size: 12px; flex-shrink: 0; }

  .picker-overlay {
    position: fixed; inset: 0; background: var(--overlay-scrim);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .picker-overlay.open { display: flex; }
  .picker-sheet {
    width: 100%; max-width: 480px; max-height: 78vh; background: var(--sheet-bg);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-radius: 28px 28px 0 0; box-shadow: 0 -20px 50px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; padding: 10px 18px 18px;
    animation: sheet-up 0.22s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .picker-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 14px; }
  .picker-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .picker-item {
    width: 100%; text-align: left; padding: 13px 12px; border-radius: 12px; font-size: 15px;
    color: var(--ink); background: none; margin-bottom: 2px;
  }
  .picker-item:active { background: var(--accent-soft); }
  .picker-item.combo { color: var(--accent); font-weight: 700; }
  .picker-empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 20px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--input-bg); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary { width: 100%; min-height: 50px; padding: 15px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; margin-top: 18px; letter-spacing: 0.03em; box-shadow: 0 12px 28px var(--accent-shadow); transition: transform 0.1s ease; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; box-shadow: none; }
  .btn-ghost { background: none; color: var(--accent); padding: 10px; font-size: 13px; font-weight: 700; width: 100%; margin-top: 6px; min-height: 40px; }
  .btn-sm { padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .center-screen { padding: 56px 0 0; }
  .center-screen textarea { font-family: monospace; font-size: 12px; min-height: 110px; }
  .brand-wordmark { font-size: 28px; font-weight: 900; letter-spacing: 0.12em; color: var(--ink); margin-bottom: 2px; }
  .brand-subtitle { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  .app-brand {
    font-size: 17px; font-weight: 900; letter-spacing: 0.08em; color: var(--ink);
    margin-bottom: 14px;
  }
  .app-brand span { color: var(--accent); font-weight: 700; }
  .theme-switch {
    width: 44px; height: 24px; border-radius: 999px; background: var(--pill-bg); border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: flex-start; padding: 2px; flex-shrink: 0;
    transition: background 0.2s ease, justify-content 0.2s ease;
  }
  [data-theme="dark"] .theme-switch { justify-content: flex-end; }
  .theme-switch-knob {
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); flex-shrink: 0; transition: background 0.2s ease; box-shadow: 0 0 0 3px rgba(0,0,0,0); }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(111,185,143,0.7); }
  .status-dot.stale { background: var(--danger); box-shadow: 0 0 8px rgba(224,121,111,0.6); }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 24px 20px; margin-bottom: 20px; box-shadow: var(--shadow);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .tab-view { display: none; }
  .tab-view.active { display: block; }

  #app { padding-bottom: 92px; }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 18px; z-index: 50;
    display: flex; justify-content: center;
  }
  .bottom-nav-inner {
    display: flex; gap: 6px; padding: 8px; background: var(--nav-bg);
    border: 1px solid var(--card-border); border-radius: 999px; box-shadow: var(--shadow);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .nav-icon-btn {
    width: 52px; height: 52px; border-radius: 50%; background: transparent; color: var(--ink-soft);
    font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .nav-icon-btn.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px var(--accent-shadow); transform: translateY(-2px); }

  /* ── 績效 ─────────────────────────── */
  .perf-toggle { display: flex; gap: 4px; margin-bottom: 20px; background: var(--pill-bg); border: 1px solid var(--card-border); border-radius: 999px; padding: 4px; }
  .perf-toggle button { flex: 1; padding: 9px; border-radius: 999px; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 700; }
  .perf-toggle button.active { background: var(--pill-active-bg); color: var(--accent); }
  .perf-total-label { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.05em; text-transform: uppercase; }
  .perf-total-number { font-size: 34px; font-weight: 900; color: var(--ink); margin: 2px 0 6px; }
  .perf-rv-label { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-bottom: 18px; }
  .perf-stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .perf-stat { text-align: center; }
  .perf-stat .label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .perf-stat .value { font-size: 16px; font-weight: 900; color: var(--ink); }
  .perf-chart-wrap { width: 100%; overflow: hidden; }
  .perf-chart-wrap.scrollable { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .perf-chart-wrap.scrollable svg { display: block; }
  .perf-empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 10px; }

  .line-item { display: grid; grid-template-columns: 1fr 58px 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .line-item .subtotal { font-size: 12px; color: var(--ink-soft); grid-column: 1 / 3; margin-top: -4px; margin-bottom: 4px; }
  .remove-btn { background: var(--accent-soft); color: var(--danger); font-size: 18px; width: 36px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-weight: 900; font-size: 18px; color: var(--ink); }
  .status-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px 14px; border-radius: 999px; display: none; }
  .status-msg:not(:empty) { display: block; background: var(--input-bg); color: var(--ink-soft); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .status-msg.ok { background: rgba(111,185,143,0.2); color: var(--ok); font-weight: 700; }
  .status-msg.err { background: rgba(224,121,111,0.16); color: var(--danger); font-weight: 700; }
  .greeting-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
  }
  .who-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; flex-shrink: 0; box-shadow: 0 4px 10px var(--accent-shadow); background-size: cover; background-position: center; cursor: pointer; overflow: hidden; }
  .greeting-text { flex: 1; min-width: 0; }
  .greeting-hello { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .greeting-name { font-size: 18px; font-weight: 900; color: var(--ink); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .greeting-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
  .greeting-right button { background: none; color: var(--accent); font-weight: 700; font-size: 11.5px; padding: 0; min-height: auto; }

  /* ── 最近銷售紀錄 ─────────────────── */
  .sale-record { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sale-record:last-child { border-bottom: none; }
  .sale-record-main { flex: 1; min-width: 0; }
  .sale-record-top { display: flex; justify-content: space-between; gap: 8px; }
  .sale-record-customer { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .sale-record-total { font-weight: 900; font-size: 14.5px; color: var(--ink); flex-shrink: 0; }
  .sale-record-items { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .sale-record-date { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .sale-record-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .sale-record-actions button { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .sale-record-actions button.danger { color: var(--danger); }
  .list-empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 20px 10px; }
  .editing-banner { background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .editing-banner button { background: none; color: var(--accent); text-decoration: underline; font-weight: 700; font-size: 12.5px; }

  /* ── 種鑽紀錄 ─────────────────────── */
  .diamond-add-row { display: flex; gap: 8px; align-items: center; }
  .diamond-add-row input { flex: 1; margin: 0; }
  .diamond-add-row button { flex-shrink: 0; padding: 12px 16px; }
  .diamond-record { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .diamond-record:last-child { border-bottom: none; }
  .diamond-record-main { flex: 1; min-width: 0; }
  .diamond-record-top { display: flex; align-items: center; gap: 6px; }
  .diamond-record-customer { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .diamond-due-badge { font-size: 13px; }
  .diamond-record-progress { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .diamond-record-date { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .diamond-record .btn-sm { flex-shrink: 0; }

  /* ── 庫存檢表 ─────────────────────── */
  .stock-record { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .stock-record:last-child { border-bottom: none; }
  .stock-record-name { font-size: 14px; color: var(--ink); }
  .stock-record-code { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .stock-record-qty { font-size: 16px; font-weight: 900; color: var(--ink); flex-shrink: 0; }
  .stock-record { cursor: pointer; }
  .stock-record:active { background: var(--accent-soft); }

  /* ── 設定 ─────────────────────────── */
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
  .settings-row-label { font-size: 13.5px; color: var(--ink-soft); flex: 1; }

  #setupNotice, #loginScreen, #app { display: none; }
</style>
</head>
<body>

<div id="shell">

  <div id="setupNotice" class="center-screen">
    <h2>尚未設定雲端連線</h2>
    <p>貼上 firebaseConfig 讓這個回報工具能連上資料庫。</p>
    <textarea id="configInput" placeholder='{ apiKey: "...", projectId: "...", ... }'></textarea>
    <button class="btn-primary" onclick="saveSetup()">儲存並繼續</button>
    <button class="btn-ghost" onclick="previewOnly()">先看畫面(不連資料庫)</button>
  </div>

  <div id="loginScreen" class="center-screen">
    <div class="brand-wordmark">CHARIS</div>
    <div class="brand-subtitle">Inventory Management</div>
    <p>登入後可以回報銷售跟修正庫存</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">登入</button>
    <p id="loginStatus" class="status-msg"></p>
  </div>

  <div id="app">
    <div class="app-brand">CHARIS <span>INVENTORY</span></div>
    <div class="greeting-row">
      <div class="who-avatar" id="whoAvatar" onclick="document.getElementById('avatarInput').click()">👤</div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="onAvatarSelected(event)">
      <div class="greeting-text">
        <div class="greeting-hello">Hello</div>
        <div class="greeting-name">Ariel</div>
      </div>
      <div class="greeting-right">
        <button class="theme-switch" id="themeToggleBtn" onclick="toggleTheme()" title="切換深色/淺色主題">
          <span class="theme-switch-knob" id="themeSwitchKnob"></span>
        </button>
        <div class="status-dot" id="statusDot" title="連線狀態"></div>
      </div>
    </div>

    <div class="tab-view active" id="tabSale">
      <div class="card">
        <h2>登記銷售</h2>
        <div id="editingBanner"></div>
        <label for="saleCustomer">客戶姓名</label>
        <input id="saleCustomer">
        <label>商品明細</label>
        <div id="saleLines"></div>
        <button class="btn-ghost" onclick="addSaleLine()">+ 加一項商品</button>
        <div class="total-row"><span>總計</span><span id="saleTotal">NT$ 0</span></div>
        <button class="btn-primary" id="saleSubmitBtn" onclick="submitSale()">送出銷售紀錄</button>
        <p id="saleStatus" class="status-msg"></p>
      </div>

      <div class="card">
        <h2>最近銷售紀錄</h2>
        <div id="salesListContent"></div>
      </div>
    </div>

    <div class="tab-view" id="tabAdjust">
      <div class="card">
        <h2>庫存修正</h2>
        <p>盤點後發現數量不對,填入實際數字就好,差額會自動算出來。點下面清單裡的商品可以直接帶入。</p>
        <label>商品</label>
        <button type="button" class="picker-trigger placeholder" id="adjustProduct" data-value="" onclick="openAdjustPicker()">選擇商品…<span class="chevron">▾</span></button>
        <label for="adjustQty">實際庫存數量</label>
        <input id="adjustQty" type="text" inputmode="numeric" pattern="[0-9]*" class="qty-input">
        <button class="btn-primary" id="adjustSubmitBtn" onclick="submitAdjust()">送出庫存修正</button>
        <p id="adjustStatus" class="status-msg"></p>
      </div>

      <div class="card">
        <h2>庫存檢表</h2>
        <div id="stockListContent"></div>
      </div>
    </div>

    <div class="tab-view" id="tabPerformance">
      <div class="card">
        <h2>績效</h2>
        <div class="perf-toggle">
          <button class="active" data-range="week" onclick="setPerfRange('week')">本週</button>
          <button data-range="month" onclick="setPerfRange('month')">本月</button>
          <button data-range="year" onclick="setPerfRange('year')">全年</button>

<script type="module">
import { initFirebase, loadConfig, saveConfig, parseConfigInput } from "./firebase-init.js?v=2";
import { escapeHtml, formatCurrency, todayISO, uid } from "./shared.js?v=2";
import { PRODUCTS } from "./products-seed.js?v=2";
import { COMBOS } from "./combos-seed.js?v=2";
import {
  collection, addDoc, serverTimestamp, doc, getDoc, setDoc, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

let db, auth;
let saleLineCount = 0;
let previewMode = false;
let dailyTotals = [];
let perfRange = "week";
let perfUnsubscribe = null;
let lastSyncAt = null; // 本機同步程式最後一次更新績效資料的時間
let salesList = [];
let editingSaleId = null;
let diamondCustomers = [];
let stockList = [];
let customerTotals = [];

// ── 深色/淺色主題切換 ─────────────────────
const MOON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>`;
const SUN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`;

function currentTheme() {
  return document.documentElement.getAttribute("data-theme") || "light";
}

function renderThemeToggleIcon() {
  const knob = document.getElementById("themeSwitchKnob");
  if (knob) knob.innerHTML = currentTheme() === "dark" ? SUN_ICON : MOON_ICON;
  const meta = document.getElementById("metaThemeColor");
  if (meta) meta.setAttribute("content", currentTheme() === "dark" ? "#0c0c0d" : "#f4f4f5");
}

window.toggleTheme = function () {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("charis-theme", next); } catch (e) {}
  renderThemeToggleIcon();
};

renderThemeToggleIcon();

const SYNC_STALE_MS = 6 * 60 * 1000; // 同步程式每 2 分鐘跑一次,超過 6 分鐘沒更新就算異常

function updateStatusDot() {
  const dot = document.getElementById("statusDot");
  if (!dot) return;
  if (previewMode) {
    dot.className = "status-dot ok";
    dot.title = "預覽模式";
    return;
  }
  if (!lastSyncAt) {
    dot.className = "status-dot";
    dot.title = "尚未收到同步資料";
    return;
  }
  const fresh = (Date.now() - lastSyncAt.getTime()) < SYNC_STALE_MS;
  dot.className = "status-dot " + (fresh ? "ok" : "stale");
  dot.title = fresh ? "連線正常,本機同步程式運作中" : "本機同步程式可能沒開,或電腦沒開著";
}
setInterval(updateStatusDot, 30 * 1000);

async function onLoggedIn(user) {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("settingsWhoAmI").textContent = user.email;
  if (saleLineCount === 0) addSaleLine();
  renderAdjustOptions();
  const diamondDateInput = document.getElementById("diamondDate");
  if (diamondDateInput && !diamondDateInput.value) diamondDateInput.value = todayISO();

  try {
    const profileSnap = await getDoc(doc(db, "userProfile", "me"));
    if (profileSnap.exists() && profileSnap.data().photoDataUrl) {
      setAvatarImage(profileSnap.data().photoDataUrl);
    }
  } catch (e) { console.error(e); }

  if (perfUnsubscribe) perfUnsubscribe();
  perfUnsubscribe = onSnapshot(doc(db, "performanceSnapshot", "latest"), (snap) => {
    dailyTotals = (snap.exists() && snap.data().dailyTotals) || [];
    salesList = (snap.exists() && snap.data().salesList) || [];
    diamondCustomers = (snap.exists() && snap.data().diamondCustomers) || [];
    stockList = (snap.exists() && snap.data().stockList) || [];
    customerTotals = (snap.exists() && snap.data().customerTotals) || [];
    lastSyncAt = (snap.exists() && snap.data().updatedAt && snap.data().updatedAt.toDate) ? snap.data().updatedAt.toDate() : new Date();
    renderPerformance();
    renderSalesList();
    renderDiamondList();
    renderStockList();
    renderCustomerTotals();
    updateStatusDot();
  }, (e) => { console.error(e); dailyTotals = []; renderPerformance(); updateStatusDot(); });
}

window.previewOnly = function () {
  previewMode = true;
  document.getElementById("setupNotice").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("settingsWhoAmI").textContent = "預覽模式(未連資料庫)";
  if (saleLineCount === 0) addSaleLine();
  renderAdjustOptions();
  const diamondDateInput = document.getElementById("diamondDate");
  if (diamondDateInput && !diamondDateInput.value) diamondDateInput.value = todayISO();
  dailyTotals = [];
  renderPerformance();
  salesList = [];
  renderSalesList();
  diamondCustomers = [];
  renderDiamondList();
  stockList = [];
  renderStockList();
  customerTotals = [];
  renderCustomerTotals();
  updateStatusDot();
};

function boot() {
  const config = loadConfig();
  if (!config) {
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  try {
    const fb = initFirebase(config);
    db = fb.db;
    auth = fb.auth;
  } catch (e) {
    console.error(e);
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  onAuthStateChanged(auth, (user) => {
    if (user) {
      onLoggedIn(user);
    } else {
      document.getElementById("app").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
    }
  });
}

window.saveSetup = function () {
  const raw = document.getElementById("configInput").value.trim();
  if (!raw) { alert("請先貼上 firebaseConfig 內容"); return; }
  try {
    const configObj = parseConfigInput(raw);
    saveConfig(configObj);
    document.getElementById("setupNotice").style.display = "none";
    const fb = initFirebase(configObj);
    db = fb.db;
    auth = fb.auth;
    document.getElementById("loginScreen").style.display = "block";
    onAuthStateChanged(auth, (user) => {
      if (user) onLoggedIn(user);
    });
  } catch (e) {
    alert(e.message);
  }
};

window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "登入中…";
  statusEl.className = "status-msg";
  try {
    await signInWithEmailAndPassword(auth, email, password);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "登入失敗:" + e.message;
    statusEl.className = "status-msg err";
  }
};

window.doLogout = function () {
  if (previewMode) {
    previewMode = false;
    document.getElementById("app").style.display = "none";
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  signOut(auth);
};

// ── tabs ─────────────────────────────────
window.switchTab = function (tab) {
  document.getElementById("tabSale").classList.toggle("active", tab === "sale");
  document.getElementById("tabAdjust").classList.toggle("active", tab === "adjust");
  document.getElementById("tabPerformance").classList.toggle("active", tab === "performance");
  document.getElementById("tabDiamond").classList.toggle("active", tab === "diamond");
  document.getElementById("tabCustomers").classList.toggle("active", tab === "customers");
  document.getElementById("tabSettings").classList.toggle("active", tab === "settings");
  document.getElementById("navBtnSale").classList.toggle("active", tab === "sale");
  document.getElementById("navBtnAdjust").classList.toggle("active", tab === "adjust");
  document.getElementById("navBtnPerformance").classList.toggle("active", tab === "performance");
  document.getElementById("navBtnDiamond").classList.toggle("active", tab === "diamond");
  document.getElementById("navBtnCustomers").classList.toggle("active", tab === "customers");
  document.getElementById("navBtnSettings").classList.toggle("active", tab === "settings");
};

// ── 績效 ─────────────────────────────────
window.setPerfRange = function (range) {
  perfRange = range;
  document.querySelectorAll(".perf-toggle button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.range === range);
  });
  renderPerformance();
};

function filterByRange(rows, range) {
  const now = new Date();
  const cutoff = new Date(now);
  if (range === "week") cutoff.setDate(now.getDate() - 7);
  else if (range === "month") cutoff.setMonth(now.getMonth() - 1);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  return rows.filter((r) => r.date >= cutoffStr);
}

const WEEKDAY_LABELS = ["一", "二", "三", "四", "五", "六", "日"];

// 本週固定顯示週一到週日 7 欄,沒有資料的那天就是 0
function buildWeekBars(dailyTotals) {
  const now = new Date();
  const dow = now.getDay(); // 0=Sun..6=Sat
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  const byDate = {};
  dailyTotals.forEach((r) => { byDate[r.date] = r; });
  const bars = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dateStr = d.toISOString().slice(0, 10);
    const row = byDate[dateStr];
    bars.push({ label: WEEKDAY_LABELS[i], total: (row && row.total) || 0, rv: (row && row.rv) || 0, isToday: dateStr === now.toISOString().slice(0, 10) });
  }
  return bars;
}

function buildDateBars(rows) {
  return rows.map((r) => ({ label: r.date.slice(5).replace("-", "/"), total: r.total, rv: r.rv || 0, isToday: false }));
}

const MONTH_LABELS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

// 全年固定顯示1~12月共12欄,每欄加總當月所有天,沒有資料的月份就是 0
function buildYearBars(dailyTotals) {
  const now = new Date();
  const totalsByMonth = new Array(12).fill(0);
  const rvByMonth = new Array(12).fill(0);
  dailyTotals.forEach((r) => {
    const d = new Date(r.date);
    if (d.getFullYear() === now.getFullYear()) {
      totalsByMonth[d.getMonth()] += r.total;
      rvByMonth[d.getMonth()] += (r.rv || 0);
    }
  });
  return totalsByMonth.map((total, i) => ({ label: MONTH_LABELS[i], total, rv: rvByMonth[i], isToday: i === now.getMonth() }));
}

window.__setTestData = function (rows) {
  dailyTotals = rows;
  renderPerformance();
};

window.renderPerformance = function renderPerformance() {
  const el = document.getElementById("perfContent");
  if (!el) return;

  let bars;
  let scrollable = false;
  if (perfRange === "week") {
    bars = buildWeekBars(dailyTotals);
  } else if (perfRange === "year") {
    bars = buildYearBars(dailyTotals);
  } else {
    const rows = filterByRange(dailyTotals, perfRange).slice().sort((a, b) => a.date < b.date ? -1 : 1);
    if (rows.length === 0) {
      el.innerHTML = `<div class="perf-empty">還沒有績效資料。<br>電腦開著同步程式跑過一次之後就會顯示。</div>`;
      return;
    }
    bars = buildDateBars(rows);
    scrollable = true; // 本月天數較多,擠不下就用左右滾動,不硬塞進固定寬度
  }

  const activeTotals = bars.filter((b) => b.total > 0).map((b) => b.total);
  const sum = bars.reduce((a, b) => a + b.total, 0);
  const rvSum = bars.reduce((a, b) => a + (b.rv || 0), 0);
  const avg = activeTotals.length ? activeTotals.reduce((a, b) => a + b, 0) / activeTotals.length : 0;
  const max = activeTotals.length ? Math.max(...activeTotals) : 0;
  const min = activeTotals.length ? Math.min(...activeTotals) : 0;

  const h = 130, padBottom = 22, padTop = 6;
  const chartH = h - padBottom - padTop;
  const barGap = 8;
  let w, barW;
  if (scrollable) {
    barW = 26;
    w = bars.length * (barW + barGap) - barGap;
  } else {
    w = 320;
    barW = (w - barGap * (bars.length - 1)) / bars.length;
  }
  const scaleMax = max || 1;
  const points = bars.map((b, i) => {
    const x = i * (barW + barGap) + barW / 2;
    const barH = Math.max(2, (b.total / scaleMax) * chartH);
    const y = padTop + (chartH - barH);
    return { x, y, isToday: b.isToday };
  });

  function smoothLinePath(pts) {
    if (pts.length === 0) return "";
    let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      const cpx = ((p0.x + p1.x) / 2).toFixed(1);
      d += ` C${cpx},${p0.y.toFixed(1)} ${cpx},${p1.y.toFixed(1)} ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
    }
    return d;
  }

  const linePath = smoothLinePath(points);
  const baselineY = (padTop + chartH).toFixed(1);
  const areaPath = points.length > 1
    ? `${linePath} L${points[points.length - 1].x.toFixed(1)},${baselineY} L${points[0].x.toFixed(1)},${baselineY} Z`
    : "";
  const dots = points.map((p) => {
    const r = p.isToday ? 4 : 2.5;
    const fill = p.isToday ? "var(--accent)" : "var(--ink-soft)";
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${fill}" />`;
  }).join("");
  const labels = bars.map((b, i) => {
    const x = i * (barW + barGap) + barW / 2;
    return `<text x="${x.toFixed(1)}" y="${h - 6}" font-size="11" fill="var(--ink-soft)" text-anchor="middle">${escapeHtml(b.label)}</text>`;
  }).join("");

  el.innerHTML = `
    <div class="perf-total-label">${perfRange === "week" ? "本週" : perfRange === "month" ? "本月" : "全年"}總計</div>
    <div class="perf-total-number">${formatCurrency(sum)}</div>
    <div class="perf-rv-label">RV 總計 ${formatCurrency(rvSum)}</div>
    <div class="perf-chart-wrap${scrollable ? " scrollable" : ""}">
      <svg width="${scrollable ? w : "100%"}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="perfAreaGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--ink-soft)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--ink-soft)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#perfAreaGradient)" stroke="none"/>
        <path d="${linePath}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    </div>
    <div class="perf-stats-row">
      <div class="perf-stat"><div class="label">平均</div><div class="value">${formatCurrency(avg)}</div></div>
      <div class="perf-stat"><div class="label">最高</div><div class="value">${formatCurrency(max)}</div></div>
      <div class="perf-stat"><div class="label">最低</div><div class="value">${formatCurrency(min)}</div></div>
    </div>
  `;
};

// ── 大頭貼 ───────────────────────────────
function setAvatarImage(dataUrl) {
  const el = document.getElementById("whoAvatar");
  el.style.backgroundImage = `url(${dataUrl})`;
  el.textContent = "";
}

window.onAvatarSelected = function (event) {
  const file = event.target.files[0];
  if (!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = async () => {
    try {
      const size = 160;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / img.width, size / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      setAvatarImage(dataUrl);
      if (!previewMode) {
        await setDoc(doc(db, "userProfile", "me"), { photoDataUrl: dataUrl, updatedAt: serverTimestamp() });
      }
    } catch (e) {
      console.error(e);
      alert("大頭貼更新失敗:" + e.message);
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert("圖片讀取失敗"); };
  img.src = url;
};

// ── 商品選擇器(卡片式,取代原生下拉) ──────

  document.getElementById("pickerOverlay").classList.add("open");
};

window.closePicker = function () {
  document.getElementById("pickerOverlay").classList.remove("open");
  pickerTargetId = null;
};

window.openAdjustPicker = function () {
  openPicker("adjustProduct", PRODUCT_OPTIONS);
};

window.renderPickerList = function () {
  const listEl = document.getElementById("pickerList");
  if (pickerOptionsList.length === 0) {
    listEl.innerHTML = `<div class="picker-empty">找不到商品</div>`;
    return;
  }
  listEl.innerHTML = pickerOptionsList.map((o) =>
    `<button type="button" class="picker-item ${o.isCombo ? "combo" : ""}" onclick="selectPickerOption('${escapeHtml(o.code).replace(/'/g, "\\'")}')">${escapeHtml(o.label)}</button>`
  ).join("");
};

window.selectPickerOption = function (code) {
  const option = ALL_OPTIONS.find((o) => o.code === code);
  if (!option) return;
  const target = document.getElementById(pickerTargetId) || document.querySelector(`[data-picker-id="${pickerTargetId}"]`);
  if (target) {
    target.dataset.value = option.code;
    target.textContent = option.label;
    target.classList.remove("placeholder");
    target.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
  }
  closePicker();
  if (pickerTargetId === "adjustProduct") { /* no-op, value already set */ }
  else { updateSaleTotal(); }
};

// ── 登記銷售 ─────────────────────────────
window.addSaleLine = function () {
  const id = "line" + (++saleLineCount);
  const container = document.getElementById("saleLines");
  const div = document.createElement("div");
  div.className = "line-item";
  div.id = id;
  const pickerId = id + "-picker";
  div.innerHTML = `
    <button type="button" class="picker-trigger placeholder" data-role="product" data-value="" data-picker-id="${pickerId}" onclick="openPicker('${pickerId}')">選擇商品…<span class="chevron">▾</span></button>
    <input type="text" inputmode="numeric" pattern="[0-9]*" class="qty-input" value="1" data-role="qty" onchange="updateSaleTotal()">
    <button class="remove-btn" onclick="removeSaleLine('${id}')">×</button>
    <div class="subtotal" data-role="subtotal"></div>
  `;
  container.appendChild(div);
  updateSaleTotal();
};

window.removeSaleLine = function (id) {
  const el = document.getElementById(id);
  if (el) el.remove();
  updateSaleTotal();
};

function getSaleLines() {
  const lines = [];
  document.querySelectorAll("#saleLines .line-item").forEach((el) => {
    const code = el.querySelector('[data-role="product"]').dataset.value;
    const qty = Number(el.querySelector('[data-role="qty"]').value) || 0;
    const product = PRODUCTS.find((p) => p.code === code);
    const combo = !product ? COMBOS.find((c) => c.code === code) : null;
    const item = product || combo;
    if (item && qty > 0) {
      lines.push({
        code: item.code, name: item.name, qty, unitPrice: item.price,
        isCombo: !!combo, components: combo ? combo.components : null,
      });
    }
    const subtotalEl = el.querySelector('[data-role="subtotal"]');
    if (item && qty > 0) {
      subtotalEl.textContent = `${qty} × ${formatCurrency(item.price)} = ${formatCurrency(qty * item.price)}`;
    } else {
      subtotalEl.textContent = "";
    }
  });
  return lines;
}

window.updateSaleTotal = function () {
  const lines = getSaleLines();
  const total = lines.reduce((sum, l) => sum + l.qty * l.unitPrice, 0);
  document.getElementById("saleTotal").textContent = formatCurrency(total);
};

// ── 最近銷售紀錄(查看/修改/刪除) ─────────
window.renderSalesList = function renderSalesList() {
  const el = document.getElementById("salesListContent");
  if (!el) return;
  if (!salesList || salesList.length === 0) {
    el.innerHTML = `<div class="list-empty">還沒有銷售紀錄。</div>`;
    return;
  }
  el.innerHTML = salesList.map((r) => {
    const itemsSummary = (r.items || []).map((it) => `${escapeHtml(it.name || it.code)} x${it.qty}`).join("、");
    return `
      <div class="sale-record">
        <div class="sale-record-main">
          <div class="sale-record-top">
            <span class="sale-record-customer">${escapeHtml(r.customer || "(未填姓名)")}</span>
            <span class="sale-record-total">${formatCurrency(r.total)}</span>
          </div>
          <div class="sale-record-items">${itemsSummary || "-"}</div>
          <div class="sale-record-date">${escapeHtml(r.date)}</div>
        </div>
        <div class="sale-record-actions">
          <button onclick="editSaleRecord('${r.id}')" title="修改">✏️</button>
          <button class="danger" onclick="deleteSaleRecord('${r.id}')" title="刪除">🗑</button>
        </div>
      </div>
    `;
  }).join("");
};

function fillSaleLineWithCode(el, code, qty) {
  const option = ALL_OPTIONS.find((o) => o.code === code);
  const trigger = el.querySelector('[data-role="product"]');
  if (option && trigger) {
    trigger.dataset.value = option.code;
    trigger.textContent = option.label;
    trigger.classList.remove("placeholder");
    trigger.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
  }
  const qtyInput = el.querySelector('[data-role="qty"]');
  if (qtyInput) qtyInput.value = qty;
}

window.editSaleRecord = function (id) {
  const record = salesList.find((r) => r.id === id);
  if (!record) return;
  document.getElementById("saleCustomer").value = record.customer || "";
  document.getElementById("saleLines").innerHTML = "";
  saleLineCount = 0;
  (record.items || []).forEach((item) => {
    addSaleLine();
    const el = document.getElementById("saleLines").lastElementChild;
    fillSaleLineWithCode(el, item.code, item.qty);
  });
  if (!record.items || record.items.length === 0) addSaleLine();
  updateSaleTotal();
  editingSaleId = id;
  document.getElementById("saleSubmitBtn").textContent = "更新此筆";
  document.getElementById("editingBanner").innerHTML =
    `<div class="editing-banner"><span>正在修改這筆紀錄</span><button onclick="cancelEditSale()">取消</button></div>`;
  switchTab("sale");
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.cancelEditSale = function () {
  editingSaleId = null;
  document.getElementById("saleSubmitBtn").textContent = "送出銷售紀錄";
  document.getElementById("editingBanner").innerHTML = "";
  document.getElementById("saleCustomer").value = "";
  document.getElementById("saleLines").innerHTML = "";
  saleLineCount = 0;
  addSaleLine();
  updateSaleTotal();
};

window.deleteSaleRecord = async function (id) {
  if (!confirm("確定要刪除這筆銷售紀錄嗎?")) return;
  if (previewMode) {
    salesList = salesList.filter((r) => r.id !== id);
    renderSalesList();
    return;
  }
  try {
    await addDoc(collection(db, "pendingActions"), {
      type: "deleteSale", saleId: id, date: todayISO(), createdAt: serverTimestamp(), synced: false,
    });
  } catch (e) {
    alert("刪除失敗:" + e.message);
  }
};

window.submitSale = async function () {
  const customer = document.getElementById("saleCustomer").value.trim();
  const lines = getSaleLines();
  const statusEl = document.getElementById("saleStatus");
  const btn = document.getElementById("saleSubmitBtn");
  if (previewMode) { statusEl.textContent = "預覽模式,不會真的送出"; statusEl.className = "status-msg"; return; }
  if (!customer) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  if (lines.length === 0) { statusEl.textContent = "請至少選一項商品"; statusEl.className = "status-msg err"; return; }
  btn.disabled = true;
  statusEl.textContent = "送出中…";
  statusEl.className = "status-msg";
  try {
    if (editingSaleId) {
      await addDoc(collection(db, "pendingActions"), {
        type: "editSale",
        saleId: editingSaleId,
        customer,
        items: lines,
        date: todayISO(),
        createdAt: serverTimestamp(),
        synced: false,
      });
      statusEl.textContent = "已送出修改,電腦開著時會自動同步進 Excel";
    } else {
      await addDoc(collection(db, "pendingActions"), {
        type: "sale",
        customer,
        items: lines,
        date: todayISO(),
        createdAt: serverTimestamp(),
        synced: false,
      });
      statusEl.textContent = "已送出,電腦開著時會自動同步進 Excel";
    }
    statusEl.className = "status-msg ok";
    cancelEditSale();
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message;
    statusEl.className = "status-msg err";
  } finally {
    btn.disabled = false;
  }
};

// ── 種鑽紀錄(查看進度/新增客人/種下一顆) ──
window.renderDiamondList = function renderDiamondList() {
  const el = document.getElementById("diamondListContent");
  if (!el) return;
  if (!diamondCustomers || diamondCustomers.length === 0) {
    el.innerHTML = `<div class="list-empty">還沒有種鑽紀錄。</div>`;
    return;
  }
  const visible = diamondCustomers.filter((c) => c.diamondCount < 6);
  if (visible.length === 0) {
    el.innerHTML = `<div class="list-empty">還沒有種鑽紀錄。</div>`;
    return;
  }
  el.innerHTML = visible.map((c) => {
    const i = diamondCustomers.indexOf(c);
    return `
      <div class="diamond-record">
        <div class="diamond-record-main">
          <div class="diamond-record-top">
            <span class="diamond-record-customer">${escapeHtml(c.customer)}</span>
            ${c.isDue ? `<span class="diamond-due-badge">🔔</span>` : ""}
          </div>
          <div class="diamond-record-progress">已種 ${c.diamondCount}/6 顆${c.hasTrial ? " · 已體驗" : ""}</div>
          <div class="diamond-record-date">${c.lastDate ? escapeHtml(c.lastDate) : "尚未開始"}</div>
        </div>
        <button class="btn-sm" onclick="plantDiamondAt(${i})">種下一顆</button>
      </div>
    `;
  }).join("");
};

async function doPlantDiamond(customerName) {
  const name = (customerName || "").trim();
  if (!name) return;
  const dateInput = document.getElementById("diamondDate");
  const date = (dateInput && dateInput.value) || todayISO();
  if (previewMode) {
    const existing = diamondCustomers.find((c) => c.customer === name);
    if (existing) {
      if (existing.diamondCount < 6) existing.diamondCount++;
      existing.lastDate = date;
      existing.isDue = false;
    } else {
      diamondCustomers.push({ customer: name, diamondCount: 1, hasTrial: false, lastDate: date, isDue: false });
    }
    renderDiamondList();
    return;
  }
  await addDoc(collection(db, "pendingActions"), {
    type: "plantDiamond", customer: name, date, createdAt: serverTimestamp(), synced: false,
  });
}

window.plantDiamondAt = async function (i) {
  const c = diamondCustomers[i];
  if (!c) return;
  try {
    await doPlantDiamond(c.customer);
  } catch (e) {
    alert("送出失敗:" + e.message);
  }
};

window.addDiamondCustomer = async function () {
  const input = document.getElementById("diamondNewCustomer");
  const name = input.value.trim();
  const statusEl = document.getElementById("diamondStatus");
  if (!name) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  statusEl.textContent = "送出中…";
  statusEl.className = "status-msg";
  try {
    await doPlantDiamond(name);
    input.value = "";
    statusEl.textContent = previewMode ? "已加入(預覽模式,未真的送出)" : "已送出,電腦開著時會自動同步進 Excel";
    statusEl.className = "status-msg ok";
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message;
    statusEl.className = "status-msg err";
  }
};

// ── 庫存檢表(純查看全部商品目前庫存) ──────
window.renderStockList = function renderStockList() {
  const el = document.getElementById("stockListContent");
  if (!el) return;
  if (!stockList || stockList.length === 0) {
    el.innerHTML = `<div class="list-empty">還沒有庫存資料。</div>`;
    return;
  }
  el.innerHTML = stockList.map((s) => `
    <div class="stock-record" onclick="selectStockForAdjust('${escapeHtml(s.code).replace(/'/g, "\\'")}')">
      <div>
        <div class="stock-record-name">${escapeHtml(s.name || s.code)}</div>
        <div class="stock-record-code">${escapeHtml(s.code)}</div>
      </div>
      <div class="stock-record-qty">${s.stock}</div>
    </div>
  `).join("");
};

// 點庫存檢表裡的商品,直接把該商品帶進上面的庫存修正表單,不用再從選單裡搜一次
window.selectStockForAdjust = function (code) {
  const option = PRODUCT_OPTIONS.find((o) => o.code === code);
  const target = document.getElementById("adjustProduct");
  if (option && target) {
    target.dataset.value = option.code;
    target.textContent = option.label;
    target.classList.remove("placeholder");
    target.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
  }
  const qtyInput = document.getElementById("adjustQty");
  if (qtyInput) { qtyInput.focus(); qtyInput.select(); }
};

// ── 客戶總消費(只要在銷售明細出現過的客戶都會加總) ──
window.renderCustomerTotals = function renderCustomerTotals() {
  const el = document.getElementById("customerTotalsContent");
  if (!el) return;
  if (!customerTotals || customerTotals.length === 0) {
    el.innerHTML = `<div class="list-empty">還沒有銷售資料。</div>`;
    return;
  }
  el.innerHTML = customerTotals.map((c) => `
    <div class="stock-record">
      <div class="stock-record-name">${escapeHtml(c.customer)}</div>
      <div class="stock-record-qty">${formatCurrency(c.total)}</div>
    </div>
  `).join("");
};

// ── 庫存修正 ─────────────────────────────
window.renderAdjustOptions = function renderAdjustOptions() {
  const btn = document.getElementById("adjustProduct");
  btn.dataset.value = "";
  btn.textContent = "選擇商品…";
  btn.classList.add("placeholder");
  btn.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
};

window.submitAdjust = async function () {
  const code = document.getElementById("adjustProduct").dataset.value;
  const targetQty = Number(document.getElementById("adjustQty").value);
  const statusEl = document.getElementById("adjustStatus");
  const btn = document.getElementById("adjustSubmitBtn");
  const product = PRODUCTS.find((p) => p.code === code);
  if (previewMode) { statusEl.textContent = "預覽模式,不會真的送出"; statusEl.className = "status-msg"; return; }
  if (!product) { statusEl.textContent = "請選擇商品"; statusEl.className = "status-msg err"; return; }
  if (!Number.isFinite(targetQty) || targetQty < 0) { statusEl.textContent = "請填正確的數量"; statusEl.className = "status-msg err"; return; }
  btn.disabled = true;
  statusEl.textContent = "送出中…";
  statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, "pendingActions"), {
      type: "stockAdjust",
      code: product.code,
      name: product.name,
      targetQty,
      date: todayISO(),
      createdAt: serverTimestamp(),
      synced: false,
    });
    statusEl.textContent = "已送出,電腦開著時會自動同步進 Excel";
    statusEl.className = "status-msg ok";
    document.getElementById("adjustQty").value = "";
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message;
    statusEl.className = "status-msg err";
  } finally {
    btn.disabled = false;
  }
};

boot();
</script>
</body>
