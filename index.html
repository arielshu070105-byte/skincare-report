<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>CHARIS Inventory Management</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef1f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --card-bg: rgba(255,255,255,0.6);
    --card-border: rgba(255,255,255,0.7);
    --ink: #333c4d;
    --ink-soft: #8b96ab;
    --line: rgba(180,195,220,0.35);
    --input-bg: rgba(255,255,255,0.45);
    --accent: #8fb0d6;
    --accent-soft: rgba(143,176,214,0.16);
    --accent-ink: #ffffff;
    --radius: 26px;
    --shadow: 0 20px 50px rgba(110,130,170,0.22), 0 2px 8px rgba(110,130,170,0.1);
    --danger: #e0796f;
    --ok: #6fb98f;
    --blur: blur(22px) saturate(160%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background-color: #e7ecf5;
    background-image:
      radial-gradient(38% 32% at 12% 8%, rgba(255,206,224,0.55) 0%, rgba(255,206,224,0) 70%),
      radial-gradient(45% 38% at 92% 18%, rgba(178,208,255,0.55) 0%, rgba(178,208,255,0) 70%),
      radial-gradient(50% 42% at 15% 82%, rgba(200,230,255,0.55) 0%, rgba(200,230,255,0) 70%),
      radial-gradient(40% 36% at 88% 92%, rgba(220,200,255,0.45) 0%, rgba(220,200,255,0) 70%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #shell { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; position: relative; }
  h1 { font-size: 22px; font-weight: 900; margin: 0 0 4px; letter-spacing: 0.02em; color: var(--ink); }
  h2 { font-size: 16px; font-weight: 900; margin: 0 0 14px; letter-spacing: 0.04em; color: var(--accent); text-transform: uppercase; }
  p { line-height: 1.6; color: var(--ink-soft); font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 14px 0 6px; letter-spacing: 0.03em; }
  input, textarea {
    width: 100%; padding: 13px 14px; min-height: 48px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  input[type="number"] {
    width: 100%; min-height: 48px; font-family: inherit; font-size: 15px;
    appearance: auto; -webkit-appearance: auto;
    background: initial; border: initial; border-radius: initial; padding: 8px; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .picker-trigger {
    width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: var(--input-bg); color: var(--ink); text-align: left;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .picker-trigger.placeholder { color: var(--ink-soft); }
  .picker-trigger .chevron { color: var(--ink-soft); font-size: 12px; flex-shrink: 0; }

  .picker-overlay {
    position: fixed; inset: 0; background: rgba(50,60,80,0.35);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .picker-overlay.open { display: flex; }
  .picker-sheet {
    width: 100%; max-width: 480px; max-height: 78vh; background: rgba(255,255,255,0.88);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-radius: 28px 28px 0 0; box-shadow: 0 -20px 50px rgba(110,130,170,0.3);
    display: flex; flex-direction: column; padding: 10px 18px 18px;
    animation: sheet-up 0.22s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .picker-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 14px; }
  .picker-search {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--card-border);
    font-family: inherit; font-size: 15px; background: rgba(255,255,255,0.7); color: var(--ink);
    margin-bottom: 10px; flex-shrink: 0;
  }
  .picker-search:focus { outline: none; border-color: var(--accent); }
  .picker-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .picker-item {
    width: 100%; text-align: left; padding: 13px 12px; border-radius: 12px; font-size: 15px;
    color: var(--ink); background: none; margin-bottom: 2px;
  }
  .picker-item:active { background: var(--accent-soft); }
  .picker-item.combo { color: var(--accent); font-weight: 700; }
  .picker-empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 20px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.75); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary { width: 100%; min-height: 50px; padding: 15px; border-radius: 999px; background: linear-gradient(135deg, #a4c3e5, #8fb0d6); color: var(--accent-ink); font-weight: 700; font-size: 15px; margin-top: 18px; letter-spacing: 0.03em; box-shadow: 0 12px 28px rgba(143,176,214,0.5); transition: transform 0.1s ease; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; box-shadow: none; }
  .btn-ghost { background: none; color: var(--accent); padding: 10px; font-size: 13px; font-weight: 700; width: 100%; margin-top: 6px; min-height: 40px; }
  .btn-sm { padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .center-screen { padding: 56px 0 0; }
  .center-screen textarea { font-family: monospace; font-size: 12px; min-height: 110px; }
  .brand-wordmark { font-size: 28px; font-weight: 900; letter-spacing: 0.12em; color: var(--ink); margin-bottom: 2px; }
  .brand-subtitle { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  .app-brand { font-size: 15px; font-weight: 900; letter-spacing: 0.08em; color: var(--ink); margin-bottom: 18px; }
  .app-brand span { font-weight: 700; letter-spacing: 0.14em; color: var(--accent); font-size: 11px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 24px 20px; margin-bottom: 20px; box-shadow: var(--shadow);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .tab-view { display: none; }
  .tab-view.active { display: block; }

  #app { padding-bottom: 92px; }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 18px; z-index: 50;
    display: flex; justify-content: center;
  }
  .bottom-nav-inner {
    display: flex; gap: 10px; padding: 8px; background: rgba(255,255,255,0.55);
    border: 1px solid var(--card-border); border-radius: 999px; box-shadow: var(--shadow);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .nav-icon-btn {
    width: 56px; height: 56px; border-radius: 50%; background: transparent; color: var(--ink-soft);
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .nav-icon-btn.active { background: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(143,176,214,0.55); transform: translateY(-2px); }

  /* ── 績效 ─────────────────────────── */
  .perf-toggle { display: flex; gap: 4px; margin-bottom: 20px; background: rgba(255,255,255,0.35); border: 1px solid var(--card-border); border-radius: 999px; padding: 4px; }
  .perf-toggle button { flex: 1; padding: 9px; border-radius: 999px; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 700; }
  .perf-toggle button.active { background: rgba(255,255,255,0.85); color: var(--accent); }
  .perf-total-label { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.05em; text-transform: uppercase; }
  .perf-total-number { font-size: 34px; font-weight: 900; color: var(--ink); margin: 2px 0 18px; }
  .perf-stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .perf-stat { text-align: center; }
  .perf-stat .label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .perf-stat .value { font-size: 16px; font-weight: 900; color: var(--ink); }
  .perf-chart-wrap { width: 100%; overflow: hidden; }
  .perf-empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 10px; }

  .line-item { display: grid; grid-template-columns: 1fr 58px 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .line-item .subtotal { font-size: 12px; color: var(--ink-soft); grid-column: 1 / 3; margin-top: -4px; margin-bottom: 4px; }
  .remove-btn { background: var(--accent-soft); color: var(--danger); font-size: 18px; width: 36px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-weight: 900; font-size: 18px; color: var(--ink); }
  .status-msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 10px 14px; border-radius: 999px; display: none; }
  .status-msg:not(:empty) { display: block; background: var(--input-bg); color: var(--ink-soft); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .status-msg.ok { background: rgba(111,185,143,0.2); color: var(--ok); font-weight: 700; }
  .status-msg.err { background: rgba(224,121,111,0.16); color: var(--danger); font-weight: 700; }
  .who-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 10px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.35); border: 1px solid var(--card-border); box-shadow: var(--shadow);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .who-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; box-shadow: 0 4px 10px rgba(143,176,214,0.5); background-size: cover; background-position: center; cursor: pointer; overflow: hidden; }
  .who-row .who-email { flex: 1; font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-row button { background: none; color: var(--accent); font-weight: 700; font-size: 12.5px; flex-shrink: 0; }

  #setupNotice, #loginScreen, #app { display: none; }
</style>
</head>
<body>

<div id="shell">

  <div id="setupNotice" class="center-screen">
    <h2>尚未設定雲端連線</h2>
    <p>貼上 firebaseConfig 讓這個回報工具能連上資料庫。</p>
    <textarea id="configInput" placeholder='{ apiKey: "...", projectId: "...", ... }'></textarea>
    <button class="btn-primary" onclick="saveSetup()">儲存並繼續</button>
    <button class="btn-ghost" onclick="previewOnly()">先看畫面(不連資料庫)</button>
  </div>

  <div id="loginScreen" class="center-screen">
    <div class="brand-wordmark">CHARIS</div>
    <div class="brand-subtitle">Inventory Management</div>
    <p>登入後可以回報銷售跟修正庫存</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username">
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">登入</button>
    <p id="loginStatus" class="status-msg"></p>
  </div>

  <div id="app">
    <div class="app-brand">CHARIS <span>INVENTORY</span></div>
    <div class="who-row">
      <div class="who-avatar" id="whoAvatar" onclick="document.getElementById('avatarInput').click()">👤</div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="onAvatarSelected(event)">
      <span class="who-email" id="whoAmI"></span>
      <button onclick="doLogout()">登出</button>
    </div>

    <div class="tab-view active" id="tabSale">
      <div class="card">
        <h2>登記銷售</h2>
        <label for="saleCustomer">客戶姓名</label>
        <input id="saleCustomer">
        <label>商品明細</label>
        <div id="saleLines"></div>
        <button class="btn-ghost" onclick="addSaleLine()">+ 加一項商品</button>
        <div class="total-row"><span>總計</span><span id="saleTotal">NT$ 0</span></div>
        <button class="btn-primary" id="saleSubmitBtn" onclick="submitSale()">送出銷售紀錄</button>
        <p id="saleStatus" class="status-msg"></p>
      </div>
    </div>

    <div class="tab-view" id="tabAdjust">
      <div class="card">
        <h2>庫存修正</h2>
        <p>盤點後發現數量不對,填入實際數字就好,差額會自動算出來。</p>
        <label>商品</label>
        <button type="button" class="picker-trigger placeholder" id="adjustProduct" data-value="" onclick="openAdjustPicker()">選擇商品…<span class="chevron">▾</span></button>
        <label for="adjustQty">實際庫存數量</label>
        <input id="adjustQty" type="number" inputmode="numeric" min="0">
        <button class="btn-primary" id="adjustSubmitBtn" onclick="submitAdjust()">送出庫存修正</button>
        <p id="adjustStatus" class="status-msg"></p>
      </div>
    </div>

    <div class="tab-view" id="tabPerformance">
      <div class="card">
        <h2>績效</h2>
        <div class="perf-toggle">
          <button class="active" data-range="week" onclick="setPerfRange('week')">本週</button>
          <button data-range="month" onclick="setPerfRange('month')">本月</button>
          <button data-range="all" onclick="setPerfRange('all')">全部</button>
        </div>
        <div id="perfContent"></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-icon-btn active" id="navBtnSale" onclick="switchTab('sale')" title="登記銷售">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
          <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 8H6"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="navBtnAdjust" onclick="switchTab('adjust')" title="庫存修正">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/>
        </svg>
      </button>
      <button class="nav-icon-btn" id="navBtnPerformance" onclick="switchTab('performance')" title="績效">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-6"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="pickerOverlay" class="picker-overlay" onclick="if(event.target===this) closePicker()">
    <div class="picker-sheet">
      <div class="picker-handle"></div>
      <input id="pickerSearch" class="picker-search" placeholder="搜尋商品…" oninput="renderPickerList(this.value)">
      <div id="pickerList" class="picker-list"></div>
    </div>
  </div>

</div>

<script type="module">
import { initFirebase, loadConfig, saveConfig, parseConfigInput } from "./firebase-init.js";
import { escapeHtml, formatCurrency, todayISO, uid } from "./shared.js";
import { PRODUCTS } from "./products-seed.js";
import { COMBOS } from "./combos-seed.js";
import {
  collection, addDoc, serverTimestamp, doc, getDoc, setDoc, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

let db, auth;
let saleLineCount = 0;
let previewMode = false;
let dailyTotals = [];
let perfRange = "week";
let perfUnsubscribe = null;

function setWhoAmI(text) {
  document.getElementById("whoAmI").textContent = text;
  document.getElementById("whoAvatar").textContent = text.trim().charAt(0).toUpperCase() || "👤";
}

async function onLoggedIn(user) {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  setWhoAmI(user.email);
  if (saleLineCount === 0) addSaleLine();
  renderAdjustOptions();

  try {
    const profileSnap = await getDoc(doc(db, "userProfile", "me"));
    if (profileSnap.exists() && profileSnap.data().photoDataUrl) {
      setAvatarImage(profileSnap.data().photoDataUrl);
    }
  } catch (e) { console.error(e); }

  if (perfUnsubscribe) perfUnsubscribe();
  perfUnsubscribe = onSnapshot(doc(db, "performanceSnapshot", "latest"), (snap) => {
    dailyTotals = (snap.exists() && snap.data().dailyTotals) || [];
    renderPerformance();
  }, (e) => { console.error(e); dailyTotals = []; renderPerformance(); });
}

window.previewOnly = function () {
  previewMode = true;
  document.getElementById("setupNotice").style.display = "none";
  document.getElementById("app").style.display = "block";
  setWhoAmI("預覽模式(未連資料庫)");
  if (saleLineCount === 0) addSaleLine();
  renderAdjustOptions();
  dailyTotals = [];
  renderPerformance();
};

function boot() {
  const config = loadConfig();
  if (!config) {
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  try {
    const fb = initFirebase(config);
    db = fb.db;
    auth = fb.auth;
  } catch (e) {
    console.error(e);
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  onAuthStateChanged(auth, (user) => {
    if (user) {
      onLoggedIn(user);
    } else {
      document.getElementById("app").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
    }
  });
}

window.saveSetup = function () {
  const raw = document.getElementById("configInput").value.trim();
  if (!raw) { alert("請先貼上 firebaseConfig 內容"); return; }
  try {
    const configObj = parseConfigInput(raw);
    saveConfig(configObj);
    document.getElementById("setupNotice").style.display = "none";
    const fb = initFirebase(configObj);
    db = fb.db;
    auth = fb.auth;
    document.getElementById("loginScreen").style.display = "block";
    onAuthStateChanged(auth, (user) => {
      if (user) onLoggedIn(user);
    });
  } catch (e) {
    alert(e.message);
  }
};

window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = "登入中…";
  statusEl.className = "status-msg";
  try {
    await signInWithEmailAndPassword(auth, email, password);
    statusEl.textContent = "";
  } catch (e) {
    statusEl.textContent = "登入失敗:" + e.message;
    statusEl.className = "status-msg err";
  }
};

window.doLogout = function () {
  if (previewMode) {
    previewMode = false;
    document.getElementById("app").style.display = "none";
    document.getElementById("setupNotice").style.display = "block";
    return;
  }
  signOut(auth);
};

// ── tabs ─────────────────────────────────
window.switchTab = function (tab) {
  document.getElementById("tabSale").classList.toggle("active", tab === "sale");
  document.getElementById("tabAdjust").classList.toggle("active", tab === "adjust");
  document.getElementById("tabPerformance").classList.toggle("active", tab === "performance");
  document.getElementById("navBtnSale").classList.toggle("active", tab === "sale");
  document.getElementById("navBtnAdjust").classList.toggle("active", tab === "adjust");
  document.getElementById("navBtnPerformance").classList.toggle("active", tab === "performance");
};

// ── 績效 ─────────────────────────────────
window.setPerfRange = function (range) {
  perfRange = range;
  document.querySelectorAll(".perf-toggle button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.range === range);
  });
  renderPerformance();
};

function filterByRange(rows, range) {
  if (range === "all") return rows;
  const now = new Date();
  const cutoff = new Date(now);
  if (range === "week") cutoff.setDate(now.getDate() - 7);
  else if (range === "month") cutoff.setMonth(now.getMonth() - 1);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  return rows.filter((r) => r.date >= cutoffStr);
}

window.__setTestData = function (rows) {
  dailyTotals = rows;
  renderPerformance();
};

window.renderPerformance = function renderPerformance() {
  const el = document.getElementById("perfContent");
  if (!el) return;
  const rows = filterByRange(dailyTotals, perfRange).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  if (rows.length === 0) {
    el.innerHTML = `<div class="perf-empty">還沒有績效資料。<br>電腦開著同步程式跑過一次之後就會顯示。</div>`;
    return;
  }
  const totals = rows.map((r) => r.total);
  const sum = totals.reduce((a, b) => a + b, 0);
  const avg = sum / totals.length;
  const max = Math.max(...totals);
  const min = Math.min(...totals);

  const w = 320, h = 120, pad = 10;
  const range = (max - min) || 1;
  const points = rows.map((r, i) => {
    const x = rows.length === 1 ? w / 2 : pad + (i / (rows.length - 1)) * (w - pad * 2);
    const y = h - pad - ((r.total - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const dots = rows.map((r, i) => {
    const [x, y] = points[i].split(",");
    return `<circle cx="${x}" cy="${y}" r="3.5" fill="#8fb0d6" />`;
  }).join("");

  el.innerHTML = `
    <div class="perf-total-label">${perfRange === "week" ? "本週" : perfRange === "month" ? "本月" : "全部"}總計</div>
    <div class="perf-total-number">${formatCurrency(sum)}</div>
    <div class="perf-chart-wrap">
      <svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline points="${points.join(" ")}" fill="none" stroke="#8fb0d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
        ${dots}
      </svg>
    </div>
    <div class="perf-stats-row">
      <div class="perf-stat"><div class="label">平均</div><div class="value">${formatCurrency(avg)}</div></div>
      <div class="perf-stat"><div class="label">最高</div><div class="value">${formatCurrency(max)}</div></div>
      <div class="perf-stat"><div class="label">最低</div><div class="value">${formatCurrency(min)}</div></div>
    </div>
  `;
};

// ── 大頭貼 ───────────────────────────────
function setAvatarImage(dataUrl) {
  const el = document.getElementById("whoAvatar");
  el.style.backgroundImage = `url(${dataUrl})`;
  el.textContent = "";
}

window.onAvatarSelected = function (event) {
  const file = event.target.files[0];
  if (!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = async () => {
    try {
      const size = 160;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / img.width, size / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      setAvatarImage(dataUrl);
      if (!previewMode) {
        await setDoc(doc(db, "userProfile", "me"), { photoDataUrl: dataUrl, updatedAt: serverTimestamp() });
      }
    } catch (e) {
      console.error(e);
      alert("大頭貼更新失敗:" + e.message);
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert("圖片讀取失敗"); };
  img.src = url;
};

// ── 商品選擇器(卡片式,取代原生下拉) ──────
const PRODUCT_OPTIONS = PRODUCTS.map((p) => ({ code: p.code, label: `${p.name}(${p.code})`, isCombo: false }));
const ALL_OPTIONS = [
  ...PRODUCT_OPTIONS,
  ...COMBOS.map((c) => ({ code: c.code, label: `【套組】${c.name}`, isCombo: true })),
];
let pickerTargetId = null;
let pickerOptionsList = ALL_OPTIONS;

window.openPicker = function (targetId, optionsList) {
  pickerTargetId = targetId;
  pickerOptionsList = optionsList || ALL_OPTIONS;
  document.getElementById("pickerSearch").value = "";
  renderPickerList("");
  document.getElementById("pickerOverlay").classList.add("open");
  document.getElementById("pickerSearch").focus();
};

window.closePicker = function () {
  document.getElementById("pickerOverlay").classList.remove("open");
  pickerTargetId = null;
};

window.openAdjustPicker = function () {
  openPicker("adjustProduct", PRODUCT_OPTIONS);
};

window.renderPickerList = function (filter) {
  const q = filter.trim().toLowerCase();
  const matches = pickerOptionsList.filter((o) => !q || o.label.toLowerCase().includes(q) || o.code.toLowerCase().includes(q));
  const listEl = document.getElementById("pickerList");
  if (matches.length === 0) {
    listEl.innerHTML = `<div class="picker-empty">找不到符合的商品</div>`;
    return;
  }
  listEl.innerHTML = matches.map((o) =>
    `<button type="button" class="picker-item ${o.isCombo ? "combo" : ""}" onclick="selectPickerOption('${escapeHtml(o.code).replace(/'/g, "\\'")}')">${escapeHtml(o.label)}</button>`
  ).join("");
};

window.selectPickerOption = function (code) {
  const option = ALL_OPTIONS.find((o) => o.code === code);
  if (!option) return;
  const target = document.getElementById(pickerTargetId) || document.querySelector(`[data-picker-id="${pickerTargetId}"]`);
  if (target) {
    target.dataset.value = option.code;
    target.textContent = option.label;
    target.classList.remove("placeholder");
    target.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
  }
  closePicker();
  if (pickerTargetId === "adjustProduct") { /* no-op, value already set */ }
  else { updateSaleTotal(); }
};

// ── 登記銷售 ─────────────────────────────
window.addSaleLine = function () {
  const id = "line" + (++saleLineCount);
  const container = document.getElementById("saleLines");
  const div = document.createElement("div");
  div.className = "line-item";
  div.id = id;
  const pickerId = id + "-picker";
  div.innerHTML = `
    <button type="button" class="picker-trigger placeholder" data-role="product" data-value="" data-picker-id="${pickerId}" onclick="openPicker('${pickerId}')">選擇商品…<span class="chevron">▾</span></button>
    <input type="number" min="1" value="1" inputmode="numeric" data-role="qty" onchange="updateSaleTotal()">
    <button class="remove-btn" onclick="removeSaleLine('${id}')">×</button>
    <div class="subtotal" data-role="subtotal"></div>
  `;
  container.appendChild(div);
  updateSaleTotal();
};

window.removeSaleLine = function (id) {
  const el = document.getElementById(id);
  if (el) el.remove();
  updateSaleTotal();
};

function getSaleLines() {
  const lines = [];
  document.querySelectorAll("#saleLines .line-item").forEach((el) => {
    const code = el.querySelector('[data-role="product"]').dataset.value;
    const qty = Number(el.querySelector('[data-role="qty"]').value) || 0;
    const product = PRODUCTS.find((p) => p.code === code);
    const combo = !product ? COMBOS.find((c) => c.code === code) : null;
    const item = product || combo;
    if (item && qty > 0) {
      lines.push({
        code: item.code, name: item.name, qty, unitPrice: item.price,
        isCombo: !!combo, components: combo ? combo.components : undefined,
      });
    }
    const subtotalEl = el.querySelector('[data-role="subtotal"]');
    if (item && qty > 0) {
      subtotalEl.textContent = `${qty} × ${formatCurrency(item.price)} = ${formatCurrency(qty * item.price)}`;
    } else {
      subtotalEl.textContent = "";
    }
  });
  return lines;
}

window.updateSaleTotal = function () {
  const lines = getSaleLines();
  const total = lines.reduce((sum, l) => sum + l.qty * l.unitPrice, 0);
  document.getElementById("saleTotal").textContent = formatCurrency(total);
};

window.submitSale = async function () {
  const customer = document.getElementById("saleCustomer").value.trim();
  const lines = getSaleLines();
  const statusEl = document.getElementById("saleStatus");
  const btn = document.getElementById("saleSubmitBtn");
  if (previewMode) { statusEl.textContent = "預覽模式,不會真的送出"; statusEl.className = "status-msg"; return; }
  if (!customer) { statusEl.textContent = "請填客戶姓名"; statusEl.className = "status-msg err"; return; }
  if (lines.length === 0) { statusEl.textContent = "請至少選一項商品"; statusEl.className = "status-msg err"; return; }
  btn.disabled = true;
  statusEl.textContent = "送出中…";
  statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, "pendingActions"), {
      type: "sale",
      customer,
      items: lines,
      date: todayISO(),
      createdAt: serverTimestamp(),
      synced: false,
    });
    statusEl.textContent = "已送出,電腦開著時會自動同步進 Excel";
    statusEl.className = "status-msg ok";
    document.getElementById("saleCustomer").value = "";
    document.getElementById("saleLines").innerHTML = "";
    saleLineCount = 0;
    addSaleLine();
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message;
    statusEl.className = "status-msg err";
  } finally {
    btn.disabled = false;
  }
};

// ── 庫存修正 ─────────────────────────────
window.renderAdjustOptions = function renderAdjustOptions() {
  const btn = document.getElementById("adjustProduct");
  btn.dataset.value = "";
  btn.textContent = "選擇商品…";
  btn.classList.add("placeholder");
  btn.insertAdjacentHTML("beforeend", `<span class="chevron">▾</span>`);
};

window.submitAdjust = async function () {
  const code = document.getElementById("adjustProduct").dataset.value;
  const targetQty = Number(document.getElementById("adjustQty").value);
  const statusEl = document.getElementById("adjustStatus");
  const btn = document.getElementById("adjustSubmitBtn");
  const product = PRODUCTS.find((p) => p.code === code);
  if (previewMode) { statusEl.textContent = "預覽模式,不會真的送出"; statusEl.className = "status-msg"; return; }
  if (!product) { statusEl.textContent = "請選擇商品"; statusEl.className = "status-msg err"; return; }
  if (!Number.isFinite(targetQty) || targetQty < 0) { statusEl.textContent = "請填正確的數量"; statusEl.className = "status-msg err"; return; }
  btn.disabled = true;
  statusEl.textContent = "送出中…";
  statusEl.className = "status-msg";
  try {
    await addDoc(collection(db, "pendingActions"), {
      type: "stockAdjust",
      code: product.code,
      name: product.name,
      targetQty,
      date: todayISO(),
      createdAt: serverTimestamp(),
      synced: false,
    });
    statusEl.textContent = "已送出,電腦開著時會自動同步進 Excel";
    statusEl.className = "status-msg ok";
    document.getElementById("adjustQty").value = "";
  } catch (e) {
    statusEl.textContent = "送出失敗:" + e.message;
    statusEl.className = "status-msg err";
  } finally {
    btn.disabled = false;
  }
};

boot();
</script>
