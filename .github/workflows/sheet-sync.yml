name: 保養品雲端同步

on:
  workflow_dispatch: {}
  # 手動測試通過、確認可以開始並行驗證期之後,再打開下面這段排程
  # schedule:
  #   - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sheet-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # firebase-admin 14.x要求node>=22,而@google-cloud/firestore是它的optionalDependency
          # 且自己也要求node>=22——node20環境下npm會「安靜跳過」這個選用套件(不報錯,
          # 只在require時才炸),本機測試用node24所以測不出來,一定要固定用22以上
          node-version: "22"
      - run: npm ci
      - run: node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
