name: 保養品雲端同步

on:
  workflow_dispatch: {}
  # 2026-09-23曾經打開過這個排程,但GitHub原生schedule本身延遲很不穩定(實測平均要4小時
  # 才跑一次),9/26改用外部的cron-job.org每分鐘呼叫workflow_dispatch取代。
  # 2026-10-09發現:這個schedule當時其實沒有真的關掉,這幾週一直跟cron-job.org同時並存,
  # 兩個觸發來源可能同時各自觸發一次執行——當天剛好發生過一次進貨數量被套用成兩倍的bug
  # (1號/5號/7號各自+5,結果變成+10),懷疑跟這個重複觸發有關。既然cron-job.org已經夠用,
  # 這裡留著只有「兩個來源同時執行」的風險,沒有任何好處,正式關掉。
  # schedule:
  #   - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sheet-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # firebase-admin 14.x要求node>=22,而@google-cloud/firestore是它的optionalDependency
          # 且自己也要求node>=22——node20環境下npm會「安靜跳過」這個選用套件(不報錯,
          # 只在require時才炸),本機測試用node24所以測不出來,一定要固定用22以上
          node-version: "22"
      - run: npm ci
      - run: node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
